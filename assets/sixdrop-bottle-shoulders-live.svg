<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" preserveAspectRatio="none">
<defs>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#fff" stop-opacity=".92"/><stop offset=".18" stop-color="#9deeff" stop-opacity=".56"/><stop offset=".45" stop-color="#ffe3f9" stop-opacity=".22"/><stop offset=".78" stop-color="#f2a7ed" stop-opacity=".48"/><stop offset="1" stop-color="#fff" stop-opacity=".85"/></linearGradient>
