name: Verify Six Candy Round v4 and public Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'assets/six-candy*'
      - 'assets/six-candy-png/**'
      - '.github/tests/six_rounds_v4*'
      - .github/tests/run_with_system_chrome.py
      - .github/workflows/verify-six-candy.yml
      - docs/six-v4-release.md
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify symmetric gaps, trajectories, palettes and payouts
        run: node .github/tests/six_rounds_v4.cjs
      - name: Prepare browser without an unbounded system package install
        run: |
          timeout 120 python3 -m pip install --disable-pip-version-check --timeout 20 playwright
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME_PATH" ]; then
            "$CHROME_PATH" --version
            echo "SIX_BROWSER_EXECUTABLE=$CHROME_PATH" >> "$GITHUB_ENV"
          else
            timeout 150 python3 -m playwright install chromium
          fi
      - name: Verify original PNG, mobile, desktop, bonuses, sugar and audio
        run: python3 .github/tests/run_with_system_chrome.py .github/tests/six_rounds_v4_browser.py
      - name: Verify the existing public Pages deployment
        run: python3 .github/tests/run_with_system_chrome.py .github/tests/six_rounds_v4_public.py
      - name: Retain browser evidence and deployment hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-candy-v4-verified-pages
          path: qa-six-v4/
          retention-days: 3
