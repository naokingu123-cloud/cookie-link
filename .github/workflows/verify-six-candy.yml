name: Verify Six Candy Stage v5 and public Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'assets/six-candy*'
      - 'assets/choco-dig*'
      - '.github/tests/canyon*'
      - 'assets/six-candy-png/**'
      - '.github/tests/six_stage_v5*'
      - .github/tests/run_with_system_chrome.py
      - .github/workflows/verify-six-candy.yml
      - docs/six-v5-release.md
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify symmetric gaps, motion and retained payouts
        run: |
          node .github/tests/six_rounds_v4.cjs
          node .github/tests/canyon_rules.cjs
      - name: Prepare browser
        run: |
          timeout 120 python3 -m pip install --disable-pip-version-check --timeout 20 playwright
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME_PATH" ]; then
            echo "SIX_BROWSER_EXECUTABLE=$CHROME_PATH" >> "$GITHUB_ENV"
          else
            timeout 150 python3 -m playwright install chromium
          fi
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --max-time 75 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf' --output "$HOME/.local/share/fonts/NotoSansCJKjp-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
      - name: Verify tutorial isolation, transitions and mobile/desktop layouts
        run: python3 .github/tests/run_with_system_chrome.py .github/tests/six_stage_v5_browser.py
      - name: Verify the real public Pages site and automatic BET start
        run: python3 .github/tests/run_with_system_chrome.py .github/tests/six_stage_v5_public.py
      - name: Retain screenshots and deployment hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-stage-v5-verified-pages
          path: qa-six-v5/
          retention-days: 3
