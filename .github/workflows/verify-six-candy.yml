name: Verify current games and public Pages
on:
  workflow_dispatch:
  push:
    branches: [main, feature/sixdrop-v248]
    paths:
      - index.html
      - 'assets/six-candy*'
      - 'assets/sixdrop-progressive*'
      - 'assets/arcade-v249/**'
      - 'assets/arcade-brand-v249*'
      - 'assets/arcade-tabs-v249*'
      - 'assets/arcade-surfaces-v249*'
      - 'assets/party-castella*'
      - 'assets/castella-lesson.js'
      - 'assets/dango*'
      - 'assets/dango-art/**'
      - 'assets/jelly-view.js'
      - 'assets/game-menu-v91.js'
      - 'assets/lineups-v91.js'
      - 'assets/choco-dig*'
      - 'assets/manual-numbers*'
      - '.github/tests/manual_numbers_browser.py'
      - '.github/tests/canyon*'
      - 'assets/six-candy-png/**'
      - '.github/tests/six_stage_v5*'
      - '.github/tests/sixdrop_public_v248.mjs'
      - 'tests/sixdrop-*'
      - 'tests/client-no-local-eight.mjs'
      - 'app-version.json'
      - 'monitor.html'
      - 'assets/monitor-ledger-v241.js'
      - 'assets/server-monitor-v24*.js'
      - .github/tests/run_with_system_chrome.py
      - .github/workflows/verify-six-candy.yml
      - docs/six-v5-release.md
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify current Six Drop, Canyon rules and client number guards
        run: |
          npm run test:sixdrop
          node .github/tests/canyon_rules.cjs
          node .github/tests/canyon_shapes.cjs
          node tests/client-no-local-eight.mjs
      # Archived v5 browser scripts assume an inline bundle, five stages,
      # fixed all-clear awards and player-side manual/local draws. Current
      # equivalent behavior is checked through the real isolated shared client.
      - name: Prepare browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify current HUD and ten-game automatic BET on an isolated server
        run: node tests/sixdrop-hud-v247.mjs
      - name: Verify published hashes and frontend without public game actions
        run: node .github/tests/sixdrop_public_v248.mjs
      - name: Retain screenshots and deployment hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sixdrop-current-verified-pages
          path: |
            qa-client-v243/
            qa-six-v248-public/
          retention-days: 3
