name: Integrate Six Candy v6 five-batch chance rounds
on:
  push:
    branches: [main]
    paths:
      - '.github/maintenance/six_candy_v6_20261026.py'
      - '.github/workflows/integrate-six-v6.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply v6 rules and presentation
        run: python3 .github/maintenance/six_candy_v6_20261026.py
      - name: Verify JS syntax and rule regression
        run: |
          node .github/tests/six_rounds_v4.cjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "drawMode='grouped'" in s
          assert 'this.maxRounds=5' in s
          assert "SIX_CHANCE_RATE=.12" in s
          assert "CHANCE! 3色" in s
          assert "six-role-chime" in s
          assert "circle class=\"perimeter-rail\"" in s
          assert "NORMAL_DRAW_GROUPS=Object.freeze([3,2,1,1,1])" in s
          print('SIX_V6_STATIC_PASS')
          PY
      - name: Save verified game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/six-candy-rounds-engine.js assets/six-candy-rounds-ui.js assets/six-candy-rounds.css assets/six-candy-art.js assets/six-candy.js .github/tests/six_rounds_v4.cjs docs/SIX_CANDY_V6_20261026.md
          git commit -m "Add five-batch five-round Six Candy chance boards and fast progression"
          git push
