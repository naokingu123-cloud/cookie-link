name: Jelly crystal atelier v300
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/jelly-*-v300.*'
      - 'assets/jelly-art-v300/**'
      - 'assets/jelly-rules.js'
      - 'assets/jelly-host.js'
      - 'assets/jelly-view.js'
      - 'assets/jelly-lesson.js'
      - 'assets/award-presentation-v277.js'
      - 'assets/demo-suite-v91.js'
      - 'index.html'
      - 'tests/jelly-v300-*.mjs'
      - '.github/workflows/jelly-v300.yml'
permissions:
  contents: read
jobs:
  native-jelly-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [bingo, full, odds]
    env:
      JELLY300_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unchanged native Jelly graph, cumulative payouts and reachable witnesses
        run: |
          node --check tests/jelly-v300-browser.mjs
          node tests/jelly-v300-rules.mjs
          node tests/jelly-v300-awards.mjs
          node tests/jelly-v288-lines.mjs
          node tests/award-presentation-v277.mjs
          node tests/jelly-v300-browser.mjs --fixtures-only
      - name: Japanese fonts and Chromium
        run: |
          if [ -z "$(fc-list :lang=ja family)" ]; then
            timeout 150s sudo bash -e -c '
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y fonts-noto-cjk
            '
          fi
          test -n "$(fc-list :lang=ja family)"
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            timeout 150s npx playwright install --with-deps chromium
            browser_path="$(node -p "require('playwright').chromium.executablePath()")"
          fi
          test -x "$browser_path"
          timeout 20s "$browser_path" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Real BINGO, all twelve lines, odds-only status and eighth-ball RESULT
        run: node tests/jelly-v300-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jelly-v300-presentation-${{ matrix.group }}
          path: qa-jelly-v300/
          if-no-files-found: error
          retention-days: 7
