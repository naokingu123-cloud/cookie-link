name: Verify published Six Candy live artwork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/six-candy-art-20261026.yml', 'index.html', 'assets/six-candy.js']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Confirm integrated artwork and unchanged rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'function sixArtCandySprite' in s
          assert 'function sixPaintCandyNumber' in s
          assert 'function sixArtLogoMarkup' in s
          assert Path('assets/six-candy-rounds-engine.js').read_text() in s
          print('LIVE_CANDY_INTEGRATION_AND_ORIGINAL_RULES_PRESENT')
          PY
      - name: Install isolated browser verification
        run: |
          pip install playwright >/tmp/six-art-browser.log 2>&1
          python3 -m playwright install --with-deps chromium >>/tmp/six-art-browser.log 2>&1 || { tail -60 /tmp/six-art-browser.log; exit 1; }
      - name: Verify existing game rules and new live artwork
        run: |
          python3 .github/tests/six_candy_rounds_20261026.py
          python3 .github/tests/six_candy_art_20261026.py
      - name: Retain browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-candy-art-verification
          path: qa-six-art/
          retention-days: 3
          if-no-files-found: ignore
