name: Six Drop compact cabinet, 200-drop colours and RTP v284
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/sixdrop-*'
      - 'assets/sixdrop-art-v278/**'
      - 'assets/award-presentation-v277.js'
      - 'assets/recorded-round-v255.js'
      - 'assets/local-debug-game-v258.js'
      - 'assets/download-worker-v255.js'
      - 'assets/server-offline-settlement-worker-v3.js'
      - 'assets/server-payout-control-v3.js'
      - 'assets/shared-machine-core-v196.js'
      - 'assets/download-assets-v255.json'
      - 'server-payout-preload-v3.mjs'
      - 'index.html'
      - 'app-version.json'
      - 'tests/sixdrop-v278-*'
      - 'tests/sixdrop-v280-*'
      - 'tests/sixdrop-v283-*'
      - 'tests/sixdrop-v284-*'
      - 'tests/sixdrop-v285-*'
      - 'tests/payout-fit-v302-layout.mjs'
      - 'scripts/sixdrop-v284-*'
      - 'scripts/sixdrop-v285-*'
      - '.github/workflows/sixdrop-v278.yml'
  push:
    branches: [main]
    paths:
      - 'assets/sixdrop-*'
      - 'assets/sixdrop-art-v278/**'
      - 'assets/award-presentation-v277.js'
      - 'assets/recorded-round-v255.js'
      - 'assets/local-debug-game-v258.js'
      - 'assets/download-worker-v255.js'
      - 'assets/server-offline-settlement-worker-v3.js'
      - 'assets/server-payout-control-v3.js'
      - 'assets/shared-machine-core-v196.js'
      - 'assets/download-assets-v255.json'
      - 'server-payout-preload-v3.mjs'
      - 'index.html'
      - 'app-version.json'
      - 'tests/sixdrop-v278-*'
      - 'tests/sixdrop-v280-*'
      - 'tests/sixdrop-v283-*'
      - 'tests/sixdrop-v284-*'
      - 'tests/sixdrop-v285-*'
      - 'tests/payout-fit-v302-layout.mjs'
      - 'scripts/sixdrop-v284-*'
      - 'scripts/sixdrop-v285-*'
      - '.github/workflows/sixdrop-v278.yml'
permissions:
  contents: read
jobs:
  grouped-rules-and-continuation:
    name: Single-ball rules, legacy groups and continuation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Simultaneous groups, convex count payouts and progressive conservation
        run: node tests/sixdrop-v278-rules.cjs
      - name: Rounded v280 role tables and preserved legacy saved games
        run: node tests/sixdrop-v280-rules.cjs
      - name: Saved v283 single balls, exact six-neighbour removal and historical trace hashes
        run: node tests/sixdrop-v283-rules.cjs
      - name: Native Arcade, repeated carry, checkpoint resume and offline settlement
        run: node tests/sixdrop-v278-host.cjs
      - name: Authoritative interrupted rounds, zero WIN and download ledger
        run: node tests/sixdrop-v278-settlement.mjs
      - name: Native single-ball Arcade, nine checkpoints and legacy-to-current download carry
        run: node tests/sixdrop-v283-host.cjs
      - name: Saved v283 authoritative settlement, interrupted single balls and once-only credit
        run: node tests/sixdrop-v283-settlement.mjs
      - name: Current 200-drop colours, integer accrual and exact simulation geometry
        run: |
          node tests/payout-fit-v302-layout.mjs
          node tests/sixdrop-v284-rules.cjs
      - name: Locked 200-drop palette, doubled all-clear meter and unbiased numbered layout
        run: node tests/sixdrop-v285-rules.cjs
      - name: Diagnostic 285 direct RTP across 50 90 150 settings
        run: node scripts/sixdrop-v285-calibrate.cjs --samples=256 --block-size=64 --rates=50,90,150 --bet=100
      - name: Current single-ball host, all legacy saves and both settlement workers
        run: node tests/sixdrop-v284-host.cjs
      - name: Actual removed counts, small BETs and synchronized progressive display
        run: node tests/sixdrop-v284-meter.cjs
      - name: Legacy carry and worker compatibility
        run: node tests/sixdrop-server-v248.mjs
      - name: Recorded stream and wallet isolation
        run: node tests/recorded-round-v255.mjs
      - name: Offline asset manifest
        run: node tests/download-v255-cache.mjs
  native-browser-display:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SIXDROP_QA_SHARD: ${{ matrix.shard }}
      SIXDROP_QA_SHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Japanese fonts and Chromium
        run: |
          if [ -z "$(fc-list :lang=ja family)" ]; then
            timeout 150s sudo bash -e -c '
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y fonts-noto-cjk
            '
          fi
          test -n "$(fc-list :lang=ja family)"
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            timeout 150s npx playwright install --with-deps chromium
            browser_path="$(node -p "require('playwright').chromium.executablePath()")"
          fi
          test -x "$browser_path"
          timeout 20s "$browser_path" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Real single-ball blasts, fixed logo/WIN, common frame and download checkpoints
        run: node tests/sixdrop-v278-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sixdrop-v278-display-${{ matrix.shard }}
          path: qa-sixdrop-v278/
          if-no-files-found: error
          retention-days: 7
  public-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [grouped-rules-and-continuation, native-browser-display]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published current rules, UI, artwork and cache
        run: node tests/sixdrop-v278-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sixdrop-v278-public
          path: qa-sixdrop-v278-public/
          if-no-files-found: error
          retention-days: 7
