name: Verify fixed BGM and number announcements
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fixed-bgm-announcer.yml']
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local speech synthesis and browser dependencies
        run: |
          sudo apt-get update -qq > /tmp/voice-install.log 2>&1
          sudo apt-get install -y open-jtalk open-jtalk-mecab-naist-jdic ffmpeg >> /tmp/voice-install.log 2>&1 || { tail -80 /tmp/voice-install.log; exit 1; }
          pip install playwright >> /tmp/voice-install.log 2>&1
          python -m playwright install --with-deps chromium >> /tmp/voice-install.log 2>&1 || { tail -80 /tmp/voice-install.log; exit 1; }
      - name: Generate 25 attributed number announcements
        run: python .github/maintenance/number_voice_20261025.py
      - name: Apply guarded audio-only patch
        run: python .github/maintenance/fixed_bgm_announcer_20261025.py
      - name: Test actual audio, fixed BGM gain and resets
        run: python .github/tests/fixed_bgm_announcer_20261025.py
      - name: Retain audio verification
        uses: actions/upload-artifact@v4
        with:
          name: fixed-bgm-announcer-verification
          path: |
            announcer-verification.json
            assets/audio/numbers/manifest.json
            assets/audio/numbers/01.wav
            assets/audio/numbers/25.wav
          retention-days: 3
      - name: Record verified change and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          note='\n\n## 追加更新: BGM一定音量・番号の機械音声（2026-10-25）\n'
          note+='- BGM再生ゲインは通常時0.075に固定。BET→通常の0.9秒フェードとリザルトフェードは維持。番号音声・効果音はBGMのゲインに接続せず、自動ダッキングなし。音源自体の抑揚や端末側の音量設定は別。既存BGMファイルは変更していない。\n'
          note+='- 1〜25番の「○番です」を Open JTalk + HTS Voice Mei (Normal) で事前合成したWAVとして同梱。ブラウザのspeechSynthesisは使わず、効果音と同じAudioContext上の独立バスで再生。明るい女性系の合成音声。生成元/CC BY 3.0/加工条件はassets/audio/numbers/manifest.jsonとLICENSE-Mei.txt。ゲーム内MENUにもクレジットリンクを追加。\n'
          note+='- 入賞効果音は維持し、番号音声は入賞順に一つずつ再生。連続入賞でも前の番号をcancelしない。JPCも各入賞の番号を読み上げ、同番号の再入賞も対象。リセット/音声OFF/非表示/メニューでは再生中と待機列を破棄し、遅れて終わった古い読み込みが次ゲームを邪魔しない。音声OFF/ONで過去の番号を読み直さない。\n'
          note+='- Chromium検証: 25クリップの全デコード・音声波形、実際の入賞通知12→4→25の順番、読み上げ中のBGMゲイン固定と再生継続、途中リセットと次の2ゲーム、音声OFF/ONで再読上げなし、JPC14番の連続2入賞、通常モード復帰、クレジット導線。ページ例外なし。\n'
          note+='- 抽選機/盤面Engine/同時消去/配当/描画/発射タイミングと既存BGM・効果音の素材は維持。iPhone実機の聴感、本人による読みの確認は未実施。\n'
          note+='- 最新index.html blob: `'+sha+'`。\n'
          p=Path('HANDOFF.md');p.write_text(p.read_text()+note)
          print('VERIFIED_GAME_BLOB',sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fixed-bgm-announcer.yml
          git add index.html HANDOFF.md assets/audio/numbers docs/NUMBER_VOICE_CREDITS.html
          git commit -m 'Keep BGM gain constant and play queued Japanese number announcements'
          git push origin HEAD:main
