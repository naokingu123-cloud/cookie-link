name: CookieLink sugar basket and grouped draw
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cookie-link-sugar-basket-20261025.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact sugar artwork and basket geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text();ls=s.splitlines()
          for a,b in [(2230,2247),(2308,2410),(2710,2798),(3103,3179),(3246,3278),(2220,2236)]:
              for i in range(a-1,min(b,len(ls))):
                  if len(ls[i])<15000:print(str(i+1)+': '+ls[i])
          print('BASKET_AND_SUGAR_CSS')
          for i,l in enumerate(ls[:2100]):
              if len(l)<6000 and any(k in l for k in ['basket','sugar-gem','sugar-slot','sugar-evolution','sugar-flight','sugar-award','basket-sugar']):print(str(i+1)+': '+l)
          print('TIER_DECLARATIONS')
          for m in re.finditer(r'[^\n;]*(?:wonderTier\s*=|sugar-evolution-art)[^\n]*',s):print(m.group(0)[:15000])
          PY
