name: CookieLink sugar basket and grouped draw
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cookie-link-sugar-basket-20261025.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Inspect external sugar badge contracts
        run: |
          python3 -u - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text();ls=s.splitlines()
          keep=set()
          for i,l in enumerate(ls):
              if len(l)>6000:continue
              if any(k in l for k in ['function tabs(a)','function miniature(s)','class Arcade{','function nextFromResult','function toggleJpcMode','function drawBetPreview']):keep.update(range(i,min(len(ls),i+(85 if 'class Arcade' in l else 28))))
              if i<2130 and any(k in l for k in ['.tab-sugar','.tab-slot','.tab{','.mini-wrap','.tab-bets','.tab-locked-bet','.games-deck','.tabs{','.mini-logo']):keep.add(i)
              if 'onNumber:n=>rouletteDrawSource.number(n)' in l or 'get idle' in l:keep.add(i)
          for i in sorted(keep):
              if len(ls[i])<6000:print(str(i+1)+': '+ls[i])
          PY
