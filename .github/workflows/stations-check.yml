name: Six station check
on:
  workflow_dispatch:
  push:
    paths:
      - 'server-stations-v235.mjs'
      - 'server-core-loader-v220.mjs'
      - 'assets/stations-v235.*'
      - 'assets/stations-reach-host-v239.js'
      - 'docs/stations-v238.md'
      - 'docs/stations-v239.md'
      - 'tests/stations-detail-v238.mjs'
      - 'tests/stations-highlight-v239.mjs'
      - 'tests/stations-layout-v238.mjs'
      - 'tests/stations-view-fixture-v236.mjs'
      - 'index.html'
      - 'monitor.html'
      - 'assets/shared-machine-v176.js'
      - 'assets/server-monitor-bet-now-v240.js'
      - 'assets/shared-client-background-v240.js'
      - 'assets/shared-host-keepalive-v206.js'
      - 'assets/shared-core-patch-v221.js'
      - 'docs/stations-v240.md'
      - 'tests/server-bet-now-v240.mjs'
      - 'tests/background-continuity-v240.mjs'
      - 'tests/stations*v235*'
      - 'tests/stations*v236*'
      - '.github/workflows/stations-check.yml'
jobs:
  stations:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - name: Station syntax
        run: node --check server-stations-v235.mjs && node --check assets/stations-v235.js && node --check assets/stations-reach-host-v239.js
      - name: Stations sidebar, high-pay and rotating 3D reach colors
        run: node tests/stations-detail-v238.mjs && node tests/stations-highlight-v239.mjs
      - name: Real-only migration and actual live-WIN UI
        run: node tests/stations-live-win-v236.mjs
      - name: Operator BET control and unfocused physical/client continuity
        run: node tests/server-bet-now-v240.mjs && node tests/background-continuity-v240.mjs
      - name: Two real players, live WIN, checkpoint fallback and settlement
        run: node tests/stations-two-player-v236.mjs
      - name: Seat allocation, privacy and idle-round guards
        run: node tests/stations-v235.mjs && node tests/stations-snapshot-v235.mjs && node tests/stations-round-idle-v235.mjs
      - name: Actual HTTP and WebSocket six-seat integration
        run: node tests/stations-integration-v235.mjs
      - name: Wallet restart compatibility with server diagnostics
        run: node tests/stations-wallet-repro-v235.mjs
      - name: Existing shared-machine and payout regressions
        run: npm run check && npm run test:shared
      - name: Existing tab visibility and HD60 regressions
        run: node .github/tests/nine_tab_visibility_v233.cjs && node tests/roulette-hd60-v234.mjs
