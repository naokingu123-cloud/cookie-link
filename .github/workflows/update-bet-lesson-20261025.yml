name: Update BET lesson and sugar row
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-bet-lesson-20261025.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply source-checked presentation changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess,tempfile
          path=Path('index.html')
          raw=path.read_bytes()
          def blob(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob(raw)=='59c0fb95b95a69c6c09c5038875c5523b2ddb607', 'Source changed; refusing to overwrite'
          s=raw.decode('utf-8')
          def change(old,new):
              global s
              assert s.count(old)==1, 'Patch context mismatch'
              s=s.replace(old,new,1)
          a=s.index('// BET presentation uses a private engine');b=s.index('function stopBetPreview()',a)
          change(s[a:b],'''// BET-only deterministic lesson. No live RNG, Engine, awards, records, or audio.
          const BET_COOKIE_PALETTES=[['#f2cb75','#b47a2d'],['#c38a52','#754422'],['#79503b','#3c241b'],['#f3a1b7','#a84b67']];
          let betPreview=null,betPreviewFrame=0;
          function newBetPreview(){return {elapsed:0,lastFrame:null,paused:false};}
          ''')
          change(' if(betPreview){betPreview.engine.version++;betPreview.engine.running=false;betPreview.engine.queue=[];betPreview=null;}',' betPreview=null;')
          change(' betPreview.engine.paused=paused;',' betPreview.paused=paused;')
          a=s.index('function animateBetPreview(now){');b=s.index('function betCookie(',a)
          change(s[a:b],'''function animateBetPreview(now){
           betPreviewFrame=0;
           if(!betPreview||app.phase!=='ready')return;
           const d=betPreview;if(d.paused||document.hidden||!inView){d.lastFrame=null;return;}
           if(d.lastFrame!==null)d.elapsed=(d.elapsed+Math.min(100,Math.max(0,now-d.lastFrame)))%BET_LESSON_MS;d.lastFrame=now;
           drawBetPreview(d);betPreviewFrame=requestAnimationFrame(animateBetPreview);
          }
          ''')
          a=s.index('function drawBetScene(ctx,width,d){');b=s.index('function drawBetPreview(d){',a)
          change(s[a:b],'''// Twelve presentation-only cells. This lesson never mutates a live Engine.
          const BET_LESSON_MS=14500;
          const BET_LESSON_COOKIES=[0,2,1,3, 1,1,3,2, 0,0,2,3];
          function drawBetScene(ctx,width,d){
           const t=d.elapsed%BET_LESSON_MS,cell=56,left=37,top=58;
           const progress=(start,end)=>Math.max(0,Math.min(1,(t-start)/(end-start)));
           const firstDrop=progress(2650,3100),secondDrop=progress(5050,5500),lastDrop=progress(9000,9450);
           ctx.save();ctx.scale(width/298,width/298);ctx.clearRect(0,0,298,298);
           ctx.fillStyle='#382017';ctx.fillRect(0,0,298,298);
           const label=(text,y,font,color)=>{
            ctx.font='900 '+font+'px "Hiragino Maru Gothic ProN",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='#321c15';ctx.lineWidth=3.5;
            ctx.strokeText(text,149,y,286);ctx.fillStyle=color;ctx.fillText(text,149,y,286);
           };
           ctx.fillStyle='#281510df';ctx.fillRect(0,0,298,28);label('BET中 ・ 演出見本',14,13,'#ffe5b0');
           label(t<5500?'① 連鎖をつなげる':t<9450?'② ハンマーで同色消去':'③ 最大LINKで配当アップ',41,14,'#ffe8ad');
           // The same 4 x 3 board fits within every main/mini canvas.
           for(let r=0;r<3;r++)for(let c=0;c<4;c++){
            ctx.fillStyle='#4c2d20';ctx.strokeStyle='#795039';ctx.lineWidth=1;
            ctx.beginPath();ctx.roundRect(left+c*cell+1,top+r*cell+1,cell-2,cell-2,7);ctx.fill();ctx.stroke();
           }
           for(let id=0;id<12;id++){
            const r=Math.floor(id/4),c=id%4,color=BET_LESSON_COOKIES[id];
            const first=id===8||id===9,second=id===4||id===5,hammer=id===6&&t>=5500,remote=id===3||id===11;
            let row=r;
            if(c<2&&r<2)row+=firstDrop*firstDrop;
            if(c<2&&r===0)row+=secondDrop*secondDrop;
            if(id===2||id===7)row+=lastDrop*lastDrop;
            let crackAt=-1,breakAt=-1;
            if(first){crackAt=2200;breakAt=2450;}
            else if(second){crackAt=4600;breakAt=4850;}
            else if(hammer){crackAt=7900;breakAt=8150;}
            else if(remote){crackAt=8350;breakAt=8600;}
            if(breakAt>=0&&t>=breakAt+200)continue;
            const x=left+(c+.5)*cell,y=top+(row+.5)*cell;
            ctx.save();
            if(breakAt>=0&&t>=breakAt)ctx.globalAlpha=1-(t-breakAt)/200;
            const born=hammer?Math.min(1,Math.max(0,(t-5500)/350)):1;
            betCookie(ctx,color,x,y,cell*.88*born,hammer);
            if((first&&t<2200)||(second&&t>=3100&&t<4600)||(hammer&&t<7900)||(remote&&t>=8350&&t<8600)){
             ctx.strokeStyle='#fff0a1';ctx.lineWidth=2.5;ctx.globalAlpha*=.65+.35*Math.sin(t/200)**2;
             ctx.beginPath();ctx.roundRect(x-cell*.45,y-cell*.45,cell*.9,cell*.9,7);ctx.stroke();
            }
            if(crackAt>=0&&t>=crackAt){
             ctx.globalAlpha=breakAt>=0&&t>=breakAt?1-(t-breakAt)/200:1;
             ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x-20,y-8);ctx.lineTo(x-6,y-2);ctx.lineTo(x-2,y+4);ctx.lineTo(x+5,y-2);ctx.lineTo(x+20,y+3);ctx.moveTo(x-2,y+4);ctx.lineTo(x-5,y+13);ctx.lineTo(x,y+20);
             ctx.strokeStyle='#fff1c8';ctx.lineWidth=3.5;ctx.stroke();ctx.strokeStyle='#29140d';ctx.lineWidth=1.8;ctx.stroke();
            }
            ctx.restore();
           }
           let message='同じ色がつながると…',detail='クッキーが割れて、落下！';
           if(t>=2650&&t<5500){message='落下して、さらに連鎖！';detail='同じ色をつなげよう';}
           if(t>=5500&&t<7900){message='連鎖でハンマー出現！';detail='5連鎖以上で獲得（途中省略）';}
           if(t>=7900&&t<8350){message='ハンマーが消えると…';detail='同じ色のクッキーに注目！';}
           if(t>=8350&&t<9450){message='同じ色のクッキーも割れる！';detail='離れた場所の同色も消去';}
           if(t>=9450){
            ctx.fillStyle='#281510c9';ctx.fillRect(left,top,cell*4,cell*3);
            label('最大LINKが多いほど',123,19,'#fff1c4');
            label('配当UP!!',165,34,'#ffd25b');
            message='連鎖をつないで配当アップ！';detail='※実際の盤面・配当とは別の見本';
           }
           ctx.fillStyle='#281510e8';ctx.fillRect(0,249,298,49);label(message,262,16,'#fff5cd');label(detail,284,12,'#ffe290');
           ctx.restore();
          }
          ''')
          change('width:194px;height:55px;background-size:194px 50.8px;','width:150px;height:55px;background-size:150px 50.8px;')
          result=s.encode('utf-8')
          assert blob(result)=='395c1e540f8d55ebd7f1348184cd7b6e2fa71e32', 'Result checksum mismatch'
          assert 'HAMMER_FALL_PAUSE_MS=200' in s
          with tempfile.TemporaryDirectory() as folder:
              for i,m in enumerate(re.finditer(r'<script\b[^>]*>([\s\S]*?)</script>',s)):
                  f=Path(folder)/('script'+str(i)+'.js');f.write_text(m[1],encoding='utf-8')
                  subprocess.run(['node','--check',str(f)],check=True)
          path.write_bytes(result)
          print('Verified presentation result:',blob(result))
          PY
      - name: Commit verified presentation change
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Simplify BET demo to 12 cells and compress sugar steps by 23 percent'
          git push origin HEAD:main
