name: Synchronize tutorial to the real BET countdown
on:
  push:
    branches: [main]
    paths:
      - .github/maintenance/six-stage-v5/fix-clock.py
      - .github/workflows/fix-six-bet-clock.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded clock and header correction
        run: python3 .github/maintenance/six-stage-v5/fix-clock.py
      - name: Prepare browser
        run: |
          timeout 120 python3 -m pip install --disable-pip-version-check --timeout 20 playwright
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME_PATH" ]; then echo "SIX_BROWSER_EXECUTABLE=$CHROME_PATH" >> "$GITHUB_ENV"; else timeout 150 python3 -m playwright install chromium; fi
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --max-time 75 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf' --output "$HOME/.local/share/fonts/NotoSansCJKjp-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
      - name: Verify clock synchronization and all retained behavior
        run: |
          node .github/tests/six_rounds_v4.cjs
          python3 .github/tests/run_with_system_chrome.py .github/tests/six_stage_v5_browser.py
      - name: Save verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-stage-v5-clock-fit
          path: qa-six-v5/
          retention-days: 3
      - name: Commit verified correction
        run: |
          cp qa-six-v5/verification.json docs/six-stage-v5-verification.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('HANDOFF.md');p.write_text(p.read_text()+'\n- Stage v5補正: 説明をフレーム数ではなく本物のBET残り時間へ同期。低FPSでも18秒で完了し、残り2秒は最後の説明を保持。全消し見出しの旧CSS優先度を修正しヘッダー内へ収める。\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/six-candy.js assets/six-candy-rounds-ui.js assets/six-candy-stage.css .github/tests/six_stage_v5_browser.py docs/six-stage-v5-verification.json HANDOFF.md
          git commit -m 'Keep the 18-second guide synchronized to BET even on slow renderers'
          git push origin HEAD:main
