name: CookieLink disappearance and debug reset
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cookie-link-sync-reset-20261025.yml']
permissions:
  contents: write
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded patches and JavaScript syntax checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/maintenance/sync_reset_20261025.py');s=p.read_text();s=s.replace('\\n   targets','\\n  targets');p.write_text(s)
          PY
          python3 .github/maintenance/sync_reset_20261025.py
          python3 .github/maintenance/mobile_fit_20261025.py
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix /tmp/cookielink-browser --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/cookielink-browser/node_modules/.bin/playwright install chromium
      - name: Verify actual frames, media states, mobile fit and resets
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/cookielink-server.log 2>&1 &
          node .github/tests/cookie-link-sync-reset-mobile.cjs
      - name: Record scope and commit verified changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          p=Path('HANDOFF.md');s=p.read_text()
          s+='\n## 追加更新: 破片同期・確認なし開始・即リセット・スマホ固定（2026-10-25）\n'
          s+='- 最新 index.html blob: `'+sha+'`。旧SHAよりこちらを優先。\n'
          s+='- ハンマーで巻き込む同色の通常クッキーは、光の到着→ひび割れ進行→短い保持→本体非表示と6分割破片を同一の描画時計で同期。衝撃時点では破片を描かない。通常連鎖とハンマー本体の3分割は維持。\n'
          s+='- 開始時の音声ON/OFF確認画面を削除。BGM・効果音は先読みし、自動再生が許可されれば開始時から再生。拒否・読込失敗でもゲームを止めず、普通のタップ/キー操作で再試行。ブラウザーの再生制限自体は回避しない。音声チェックボックスは維持。\n'
          s+='- 右上「即リセット」。確認/ページ再読込なしで進行中ラウンドと抽選・予約音声・破片・補充・シュガー/ハンマー飛行を取消。BET、CREDIT、獲得済みシュガーバンク、保存成績を維持してBETへ戻す。DEBUGの1秒自動開始を維持。結果/メニュー表示中もボタン使用可。\n'
          s+='- スマホは表示領域全体を固定。固定480:960比による外側余白と手動倍率セレクターを廃止。縦は横幅基準の等倍比スケール＋ルーレットの残り高さで調整。横向きは2列レイアウト。クッキー盤面は正方形を維持。ノッチ/ホーム領域の安全余白に操作を置かない。\n'
          s+='- 手動ページズームジェスチャ、倍率キー、ルーレットの二本指/ホイール距離変更を無効化。端末サイズ・向き変更による自動フィットは維持。ブラウザー/OSの強制ズームやブラウザー上部UIの完全非表示は保証しない。\n'
          s+='- 検証: JS構文、45ケースの8球結果/乱数使用数一致、消去直前に本体表示かつ破片なし/消去同時に破片、6画面サイズの余白/正方形/下部非重複、縦横変更、ピンチ/ホイール抑制、自動再生許可/拒否/音源失敗時も確認なし開始、通常操作で音声有効化、予約WAV取消、連続リセット、結果/メニューからのリセット。iPhone実機・聴感は未検証。\n'
          p.write_text(s);print('VERIFIED_GAME_BLOB',sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html HANDOFF.md .github/maintenance/sync_reset_20261025.py
          git commit -m 'Synchronize hammer fragments and add nonmodal audio, instant reset and full mobile fitting'
          git push origin HEAD:main
