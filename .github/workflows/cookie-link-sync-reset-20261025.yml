name: CookieLink disappearance and debug reset
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cookie-link-sync-reset-20261025.yml']
permissions:
  contents: write
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Keep disappeared cookies hidden until removal event
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,tempfile,subprocess
          p=Path('index.html');raw=p.read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert sha=='0c69cee74ae0839b2840129117dd487408bb3c0b','Source changed'
          s=raw.decode();Path('/tmp/cookielink-before.html').write_text(s)
          old='if(fx.elapsed>=fx.duration){stopShatter(s);return;}'
          new='if(fx.elapsed>=fx.duration){fx.elapsed=fx.duration;syncRemoteCookieVisuals(s,fx);return;} // Keep hidden until Engine removes the cookies.'
          assert s.count(old)==1;s=s.replace(old,new,1);p.write_text(s)
          t=Path('.github/tests/cookie-link-sync-reset-mobile.cjs');v=t.read_text()
          old='syncRemoteCookieVisuals,debugResetRound,activateGameAudio';assert v.count(old)==1;v=v.replace(old,'syncRemoteCookieVisuals,drawShatter,debugResetRound,activateGameAudio',1)
          old=" q.stopShatter(s);check(!s.board.querySelector('.hammer-fragment-synced'),'Reset removes synchronized visual overrides');"
          new=""" fx.elapsed=fx.duration;fx.stamp=null;a.paused=false;q.drawShatter(s,performance.now());a.paused=true;
           check(s.shatter===fx,'Final effect frame keeps removal state until Engine advances');
           for(const target of fx.remoteTargets)check(Number(getComputedStyle(s.tiles.get(target.tileId).querySelector('.sweet')).opacity)===0,'Cookie cannot reappear after its fragments finish');
           q.stopShatter(s);check(!s.board.querySelector('.hammer-fragment-synced'),'Reset removes synchronized visual overrides');"""
          assert v.count(old)==1;v=v.replace(old,new,1);t.write_text(v)
          with tempfile.TemporaryDirectory() as folder:
            for i,m in enumerate(re.finditer(r'<script\b([^>]*)>([\s\S]*?)</script>',s)):
              attrs,code=m.groups()
              if not code.strip() or re.search(r'type=[\"\x27](?:application/json|importmap)',attrs):continue
              f=Path(folder)/('script'+str(i)+('.mjs' if 'module' in attrs else '.js'));f.write_text(code);subprocess.run(['node','--check',str(f)],check=True)
          PY
      - name: Install isolated browser tests
        run: |
          npm install --prefix /tmp/cookielink-browser --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/cookielink-browser/node_modules/.bin/playwright install chromium
      - name: Verify complete effects, mobile gestures and audio/reset behavior
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/cookielink-server.log 2>&1 &
          node .github/tests/cookie-link-sync-reset-mobile.cjs
      - name: Commit verified finish-frame guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          p=Path('HANDOFF.md');s=p.read_text();s+='\n- 最終調整 index.html blob: `'+sha+'`。上記よりこちらを優先。破片終了時も本体非表示を保持し、Engineの消去イベントまで一瞬戻らないよう確認。上記45ケース・6画面・音声/リセットテストを再実行して成功。\n';p.write_text(s);print('VERIFIED_GAME_BLOB',sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html HANDOFF.md .github/tests/cookie-link-sync-reset-mobile.cjs
          git commit -m 'Keep hammer targets hidden through final fragment frame; verify mobile viewport and reset'
          git push origin HEAD:main
