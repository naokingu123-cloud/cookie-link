name: Verify and integrate original PNG Six Candy staggered board
on:
  push:
    branches: [main]
    paths: ['.github/workflows/six-png-staggered-20261026.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install guarded original PNG and staggered tray
        run: python3 .github/maintenance/six-png-60/install.py
      - name: Install browser verification
        run: |
          pip install playwright >/tmp/six-browser-install.log 2>&1
          python3 -m playwright install --with-deps chromium >>/tmp/six-browser-install.log 2>&1 || { tail -60 /tmp/six-browser-install.log; exit 1; }
      - name: Verify original-image board and preserved rules
        run: |
          SIX_SEEDS=2 node .github/tests/six_candy_staggered.cjs
          python3 .github/tests/six_candy_staggered_browser.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-png-staggered-verification
          path: |
            qa-six-staggered/
            index.html
            assets/six-candy*.js
            assets/six-candy*.css
            assets/six-candy-png/
            .github/maintenance/six-png-60/
          include-hidden-files: true
          retention-days: 2
      - name: Save verified game atomically
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil
          report=json.loads(Path('qa-six-staggered/verification.json').read_text())
          assert report['roulette_loaded'] and not report['memory_only']
          b=Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          note='\n\n## 2026-10-26 — 元PNGの4色キャンディ・8/7交互の60マス盤面\n'
          note+='- 元PNGを切り出したいちご・レモン・青渦巻き・ぶどうをWebP化して実際に組込。簡易Canvas模様への置換ではない。アトラスのSHA256と描画ピクセルを検証。数字は独立した1〜25の正確な描画、空白35マスに数字を描かない。メインと小盤面に共通使用。ロゴと背景装飾は既存のベクター/Canvasを維持。\n'
          note+='- デフォルト8段、上から7/8/7/8/7/8/7/8で60個。7〜10段の選択は残し、どの段数でも最下段8個。番号1〜25は各1個。初期4色、Round3以降3色を維持。\n'
          note+='- 同じ最密格子の新しい矩形境界へ隣接・上下三角形・六角形・3軸直線・落下を適応。下に空きがあるのに側面の接触だけで止まる問題の修正を維持し、移動先予約と同期経路検査を継続。\n'
          note+='- キャンディ中心と接触半径は静止中固定、光沢のみアニメ。落下中は経路を変えず絵を軽く回転。破砕/ビー玉効果音を既存の音声バス・ミュート・リセット取消へ接続し、別AudioContextによる無音化を修正。配当、他2ゲーム、抽選機、BGM等のホストコードは不変比較済み。\n'
          note+='- ローカル検証: 144盤面、952落下フレーム、31,416経路時点、無支持停止0、442形役テスト。GitHub Actionsで縮小seedセットとHTTP経由の実画像読込・実3D抽選機初期化・320/390/430pxと横画面/1280px・25番号/空白・小盤面・12seedの8番号進行・8回全消し/60倍・Round進行・3ゲーム同時集計/CREDIT一度・0BET/リセット・4効果音の波形と発音取消を検証。入賞番号は制御通知。\n'
          note+='- 未確認: iPhone実機、スピーカーでの聴感、自然物理の8球全軌道、原作内部処理との全ケース一致。\n'
          note+='- 最新index.html blob: `'+sha+'`。検証レポート docs/six-candy-staggered-verification.json。\n'
          p=Path('HANDOFF.md');p.write_text(p.read_text()+note)
          Path('docs').mkdir(exist_ok=True)
          shutil.copyfile('qa-six-staggered/verification.json','docs/six-candy-staggered-verification.json')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/six-candy-art-20261026.yml
          git add index.html HANDOFF.md assets/six-candy.js assets/six-candy-rounds-engine.js assets/six-candy-rounds-ui.js assets/six-candy-art.js assets/six-candy-art.css assets/six-candy-png docs/six-candy-staggered-verification.json
          git commit -m 'Use original PNG candies in playable 60-cell staggered Eight-row Six Candy'
          git push origin HEAD:main
