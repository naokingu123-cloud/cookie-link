name: Winery v61 clean photographic scenery
on:
  push:
    branches: [main]
    paths:
      - '.github/maintenance/winery_clean_v61.py'
      - '.github/workflows/winery-clean-v61.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-raster:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare image tools
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Remove baked example UI and glasses from the premium background
        run: python .github/maintenance/winery_clean_v61.py
      - name: Verify and commit high-resolution WebP
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/winery-juice-world-clean-v61.webp')
          im=Image.open(p)
          assert im.size==(1672,941)
          assert p.stat().st_size > 50000
          print('WINERY_V61_RASTER_OK',p.stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/winery-juice-world-clean-v61.webp
          if ! git diff --cached --quiet; then
            git commit -m 'art(winery): add cleaned v61 photorealistic fruit juice river backdrop [skip ci]'
            git push origin HEAD:main
          fi
