name: Apply verified CookieLink presentation patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cookie-link-presentation-20261025.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact-source patch and validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, re, subprocess, tempfile, zlib
          payload = ''
          data = json.loads(zlib.decompress(base64.b64decode(payload)))
          path = pathlib.Path('index.html')
          def blob(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          raw = path.read_bytes()
          assert blob(raw) == data['base_blob'], 'Source changed; refusing to overwrite'
          text = raw.decode('utf-8')
          for change in reversed(data['changes']):
              start, end = change['start'], change['end']
              assert text[start:end] == change['old'], 'Patch context mismatch'
              text = text[:start]+change['new']+text[end:]
          result = text.encode('utf-8')
          assert blob(result) == data['result_blob'], 'Result checksum mismatch'
          with tempfile.TemporaryDirectory() as folder:
              for i, match in enumerate(re.finditer(r'<script\b[^>]*>([\s\S]*?)</script>', text)):
                  script = pathlib.Path(folder)/('script'+str(i)+'.js')
                  script.write_text(match[1], encoding='utf-8')
                  subprocess.run(['node','--check',str(script)],check=True)
          path.write_bytes(result)
          print('Verified result blob:', blob(result))
          PY
      - name: Commit the presentation-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add isolated BET demo and 200 ms hammer-only post-clear pause'
          git push origin HEAD:main
