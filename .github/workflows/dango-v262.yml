name: Dango v264 and legacy editions - exact line-grade RTP and resumption
on:
  workflow_dispatch:
  push:
    branches: [main, feature/v262-dango-calibration]
    paths-ignore:
      - 'docs/dango-v262-layout-proof*.json'
      - 'docs/dango-v262-trial.md'
      - 'docs/dango-v262.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax, current rules and preserved legacy settlements
        run: |
          npm run check
          npm run test:dango
          node tests/recorded-round-v255.mjs
          node tests/download-v255-ledger.mjs
          node tests/download-v255-cache.mjs
          node tests/local-debug-v258.mjs
          node tests/edition-choice-v255.mjs
      - name: Reproduce exact independent calibration
        run: |
          g++ -std=c++20 -O3 scripts/dango-v262-calibrate.cpp -o /tmp/dango-v262-calibrate
          /tmp/dango-v262-calibrate > /tmp/dango-v262-independent.json
          node tests/dango-v262-calibration.mjs /tmp/dango-v262-independent.json
      - name: Independently enumerate v263 and verify 48 result vectors
        run: |
          g++ -std=c++20 -O3 scripts/dango-v263-calibrate.cpp -o /tmp/dango-v263-calibrate
          /tmp/dango-v263-calibrate > /tmp/dango-v263-independent.json
          node tests/dango-v263-calibration.mjs /tmp/dango-v263-independent.json
      - name: Independently enumerate v264 line-based grades and verify 48 result vectors
        run: |
          g++ -std=c++20 -O3 scripts/dango-v264-calibrate.cpp -o /tmp/dango-v264-calibrate
          /tmp/dango-v264-calibrate > /tmp/dango-v264-independent.json
          node tests/dango-v264-calibration.mjs /tmp/dango-v264-independent.json
      - name: Install Chromium
        timeout-minutes: 4
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "SWEETS_DOWNLOAD_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Triangle, payout table, FREE overlap and legacy view
        run: node tests/dango-v262-view.mjs
      - name: Current v264 FREE grade badges, central radius-two, edge clipping and no-line behavior
        run: node tests/dango-v264-view.mjs
      - name: Actual server recording, native ten-game calculation and deterministic retry
        run: node tests/download-v255-compute.mjs
      - name: Download offline playback and server-owned credit resume
        run: node tests/download-v255-browser.mjs
      - name: Preserve review screenshots and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dango-v262-verification
          path: |
            qa-dango-v262-view/
            qa-dango-v264-view/
            qa-download-v255/
            /tmp/dango-v262-independent.json
            /tmp/dango-v263-independent.json
            /tmp/dango-v264-independent.json
          retention-days: 7
