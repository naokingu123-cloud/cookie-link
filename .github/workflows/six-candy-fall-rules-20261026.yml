name: Verify Six Candy grid falling
on:
  push:
    branches: [main]
    paths: ['.github/workflows/six-candy-fall-rules-20261026.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded gravity-only change
        run: |
          python3 .github/maintenance/six_candy_fall_rules_20261026.py
          node .github/tests/six_candy_fall_rules_20261026.cjs
      - name: Install browser checks
        run: |
          pip install playwright >/tmp/six-fall-browser.log 2>&1
          python3 -m playwright install --with-deps chromium >>/tmp/six-fall-browser.log 2>&1 || { tail -60 /tmp/six-fall-browser.log; exit 1; }
      - name: Recheck rounds, rules, prediction, accounting and layouts
        run: python3 .github/tests/six_candy_rounds_20261026.py
      - name: Keep verification previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-candy-grid-falling-verification
          path: qa-six-rounds/
          retention-days: 3
          if-no-files-found: ignore
      - name: Save verified gravity update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('index.html');raw=p.read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          stats=json.loads(Path('/tmp/six-fall-rules-stats.json').read_text())
          note='\n\n## 2026-10-26 — シックスキャンディ落下規則の再修正\n'
          note+='- 落下のみ変更。7〜10段選択、Round、初期25番号/空白、役優先、4連結、独立配当、60倍、色数進行、他2ゲーム、3D抽選機と音声は変更なし。\n'
          note+='- 下2方向が空いたとき、横隣の球がある側と逆の下方向を優先。左右に偏りがなく真下が空けば垂直。下1方向のみ空けばその方向へ、下2方向が支持されれば停止。既存のtile.lean/ID/横移動慣性は落下選択に使わない。完全対称で2方向が同条件の場合だけ左を固定優先（予測を再現可能にするため）。\n'
          note+='- 移動可能性はマス配置から決定。同時に退く支持球を古い位置の障害物として扱わず、上の球も同じ描画ステップで追従。移動先は先に予約し、全移動元を空にしてから反映。円弧は静止支持球のまわりの描画用で、自由物理演算で着地点を決めない。支持された中空の六角形は維持する。\n'
          note+='- 参考調査: https://qiita.com/Jun_Ishikawa/items/fe6a533c0531a9071d99 および https://qiita.com/GANTZ/items/e6b5e9168b595404d582 。いずれも第三者による再現研究であり、Nintendo公式の内部アルゴリズムや原作の全配置との完全一致を確認したものではない。原作映像とのフレームごとの照合は未実施。\n'
          note+='- 新規検証: '+str(stats)+'。左右の隣接球、垂直穴、支持1個/2個、中空六角形、上2球の左右分離、複数行同時追従、ID/lean非依存、描画軌道/最終配置/予測の一致を確認。既存Chromiumの段数・Round・配当・3ゲーム混在・0BET・リセット・モバイル/PC検証も再実行。実機iPhone・原作実機との全ケース比較は未実施。\n'
          note+='- 最新index.html blob: `'+sha+'`。落下ソースはassets/six-candy-rounds-engine.js / assets/six-candy.js / index.htmlで一致。\n'
          hand=Path('HANDOFF.md');hand.write_text(hand.read_text()+note);print('VERIFIED_SIX_GRAVITY_BLOB',sha)
          PY
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/six-candy-fall-rules-20261026.yml
          git add index.html assets/six-candy-rounds-engine.js assets/six-candy.js HANDOFF.md
          git commit -m 'Use grid-directed side rules and synchronous support falling for Six Candy'
          git push origin HEAD:main
