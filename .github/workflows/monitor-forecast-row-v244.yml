name: One-line 25-number payout table v244
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'assets/server-monitor-v242.css'
      - 'assets/server-monitor-v242.js'
      - 'monitor.html'
      - 'tests/monitor-layout-v242.mjs'
      - 'app-version.json'
      - '.github/workflows/monitor-forecast-row-v244.yml'
permissions:
  contents: read
jobs:
  monitor-row:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and existing ledger regression
        run: node --check assets/server-monitor-v242.js && node tests/monitor-ledger-v241.mjs && node tests/operator-polish-v242.mjs
      - name: Browser dependencies
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: 25-number single-line and no-scroll layout at 4 screen sizes
        run: node tests/monitor-layout-v242.mjs
