name: Verify flat display and supplied BGM
on:
  push:
    paths: ['.github/workflows/surface-bgm-update.yml']
permissions:
  contents: write
  actions: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: surface-bgm-candidate
          path: /tmp/surface-candidate
          run-id: 40189688351
          github-token: ${{ github.token }}
      - name: Stage exact-source update and user-supplied audio
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,io,json
          raw=Path('index.html').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='5653e5790ea179361e3e43be593167c854b64a0b','Source changed'
          data=Path('/tmp/surface-candidate/surface-bgm-candidate.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='a0b512737ca4ebf12baf2c0d9daf24677d0bd428e37e3a415c8766610650cd86','Package mismatch'
          Path('/tmp/surface-bgm-before.html').write_bytes(raw)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              manifest=json.loads(z.read('UPDATE_MANIFEST.json'))
              for name,checksum in manifest['files'].items():
                  assert name=='index.html' or name=='qa_surface_music.py' or name.startswith('assets/audio/'),name
                  assert '..' not in Path(name).parts,name
                  value=z.read(name);assert hashlib.sha256(value).hexdigest()==checksum,name
                  target=Path(name);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(value)
          print('EXACT_SOURCE_PACKAGE_OK')
          PY
          python .github/maintenance/surface_music_followup_20261025.py
      - name: Install browser
        run: |
          pip install playwright >/tmp/browser-install.log 2>&1
          python -m playwright install --with-deps chromium >>/tmp/browser-install.log 2>&1
      - name: Test rendering and audio transitions
        run: python qa_surface_music.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-bgm-previews
          path: qa-previews/
          if-no-files-found: ignore
          retention-days: 3
      - name: Record verified behavior and save
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          note='\n\n## 追加更新: 上面中央LED・六角ステップ・添付BGM（2026-10-25）\n'
          note+='- 中央の透明タワー/脚/縦LED装飾を除去。LCDはX=0,Z=0の上面へ水平配置。物理は不変。中央文字と外周LEDは約0.9秒の滑らかな遷移。\n'
          note+='- 抽選状態/n-m/倍率の下部行は非表示。描画領域を24論理px拡大し、倍率とエラー時再読込を右上へ移設。黒い情報帯は維持。\n'
          note+='- 全消しリーチ番号: 赤→橙→黄→緑→青→紫→ピンク→赤の濃く明るい7色を5秒で補間。リーチになった時から赤で開始。\n'
          note+='- シュガー5枠は正六角形(28x32.3316)、左寄せ。横圧縮を撤去し純回転だけ残す。\n'
          note+='- メイン連鎖ポップアップは約1.55秒、LINKは開始を早め約1.45秒。抽選/消去/配当の処理時間は変更なし。\n'
          note+='- 添付43分メドレーを音響変化点を目安に7再生区間へ分割。正式な曲名/曲境界は未同定。全区間を保持し短い端部フェードを追加。切出し秒数/ハッシュはassets/audio/manifest.json。\n'
          note+='- 2つ目の添付はBET専用BGM。開始時に0.9秒でフェードアウト後、7区間から選んだ通常曲へ切替。連続同曲を避け、各ゲーム冒頭から再生。リセット時は古いフェードを無効化してBETへ戻る。音声確認画面なし。途中音声OFF/ONでも現在のフェーズに合った曲を復帰。\n'
          note+='- Chromium検証: 中央平面位置/塔撤去/描画拡大/正六角形と左寄せ、段階遷移、実マテリアルの虹色変化、表示時間、添付MP3のBET→フェード→通常曲、途中リセット/連続ゲーム/選曲重複回避/音声OFF-ON。iPhone実機の聴感・全8/70球の自然物理通しは未検証。\n'
          note+='- 最新index.html blob: `'+sha+'`。\n'
          p=Path('HANDOFF.md');p.write_text(p.read_text()+note)
          dest=Path('.github/tests/surface_music_20261025.py');dest.parent.mkdir(parents=True,exist_ok=True);Path('qa_surface_music.py').replace(dest)
          print('VERIFIED_INDEX_BLOB',sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/surface-bgm-update.yml
          git add index.html HANDOFF.md assets/audio .github/tests/surface_music_20261025.py
          git commit -m 'Flatten center LCD and add supplied BET/game music with reset-safe fades'
          git push origin HEAD:main
