name: Fix Six Candy empty-support hovering
on:
  push:
    branches: [main]
    paths: ['.github/workflows/six-candy-empty-support-fix.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded gravity-only patch
        run: python3 .github/maintenance/six_candy_empty_support_fix_20261026.py
      - name: Verify reproduced failure and independent support invariants
        run: |
          node .github/tests/six_candy_empty_support_20261026.cjs
          node .github/tests/six_candy_fall_rules_20261026.cjs
      - name: Install browser regression dependency
        run: |
          pip install playwright >/tmp/six-empty-browser.log 2>&1
          python3 -m playwright install --with-deps chromium >>/tmp/six-empty-browser.log 2>&1 || { tail -60 /tmp/six-empty-browser.log; exit 1; }
      - name: Verify real shared app and all row sizes
        run: python3 .github/tests/six_candy_rounds_20261026.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-candy-empty-support-verification
          path: qa-six-rounds/
          if-no-files-found: ignore
          retention-days: 3
      - name: Save verified fix and publish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          stats=json.loads(Path('/tmp/six-empty-support-stats.json').read_text())
          raw=Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          note='\n\n## 2026-10-26 — 真下が空いているのに止まる不具合の修正\n'
          note+='- 再現: 左右にキャンディがあり、斜め下2マスが空いていても、真下2段目が盤外または埋まっていると落下候補が空になっていた。旧版600盤面で206箇所（最下段の穴74、さらに下に支持球132）の停止を再現。\n'
          note+='- 修正: 左右の接触を支持とは扱わず、空いた中心を真下へ降りてから空きマスへ収まる連続経路を追加。さらに下に球があれば、その頂点まで降りて30度の円弧で左右に転がる。最下段付近も同様。隣のキャンディを貫通させず、既存の経路衝突検査と移動先予約を維持。\n'
          note+='- 実際に斜め下の2球で支えられた形や支持された中空ヘキサゴンは維持。変更は第3ゲームの落下のみ。段数7〜10、Round、番号、役の優先/配当、60倍、色数進行、他2ゲーム、抽選機と音声は変更なし。\n'
          note+='- 新規検証: '+json.dumps(stats,ensure_ascii=False)+'。旧版の同じ600盤面では修正後の無支持停止0箇所。別の300盤面で数保存、移動先重複なし、経路を65時点で確認、表示と最終配置一致、ID/lean非依存、予測と実処理一致を検証。既存の落下テストとブラウザの段数/役/Round/配当/リセット/3ゲーム同時集計/スマホ・PC検証も成功。\n'
          note+='- 確認限界: 原作全配置との一致やiPhone実機の確認ではない。ユーザーの具体的な停止画面は未取得で、コードから再現した同症状を修正した。\n'
          note+='- 最新 index.html blob: `'+sha+'`。更新箇所は assets/six-candy-rounds-engine.js / assets/six-candy.js / index.html で一致。\n'
          p=Path('HANDOFF.md');p.write_text(p.read_text()+note);print('VERIFIED_EMPTY_SUPPORT_BLOB',sha)
          PY
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/six-candy-empty-support-fix.yml .github/workflows/six-candy-empty-shaft-probe.yml
          git add index.html assets/six-candy-rounds-engine.js assets/six-candy.js HANDOFF.md .github/tests/six_candy_fall_rules_20261026.cjs
          git commit -m 'Fix unsupported Six Candy hovering above empty lower cells'
          git push origin HEAD:main
