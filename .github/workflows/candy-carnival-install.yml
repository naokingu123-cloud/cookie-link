name: Verify third-tab candy carnival
on:
  push:
    branches: [main]
    paths: ['.github/workflows/candy-carnival-install.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pending-batch reach contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ls=Path('index.html').read_text().splitlines();wanted=set()
          for term,n in [('function requestReach(',100),('function updateReachUI(',70),('function event(',60),('function normalReach',45),('normalRainbow',4),('function syncReachPager',25),('const reach',8),('function clearReach',25),('function predictNextHit(',20)]:
           for i,l in enumerate(ls):
            if len(l)<10000 and term in l:wanted.update(range(max(0,i-2),min(len(ls),i+n)))
          for i in sorted(wanted):
           if len(ls[i])<10000:print(str(i+1)+': '+ls[i])
          PY
