name: Verify third-tab candy carnival
on:
  push:
    branches: [main]
    paths: ['.github/workflows/candy-carnival-install.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shared contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('index.html').read_bytes();s=raw.decode();ls=s.splitlines();print('BLOB',hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest())
          spans=[('class Engine{',45),('class Arcade{',135),('function tabs(a){',55),('function hud(a){',40),('function select(',30),('capture(a){',50),('function renderRoundResult(a){',40),('function sugarStatus(',25)]
          wanted=set()
          for term,n in spans:
           at=next((i for i,l in enumerate(ls) if term in l and len(l)<10000),None)
           if at is not None:wanted.update(range(at,min(len(ls),at+n)))
          for i in sorted(wanted):
           if len(ls[i])<10000:print(str(i+1)+': '+ls[i])
          PY
