name: Dango launch timing and compact layout v269
on:
  workflow_dispatch:
  push:
    branches: [main, feature/v269-dango-layout]
    paths:
      - 'assets/**'
      - 'index.html'
      - 'app-version.json'
      - 'download-sw-v255.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/dango-layout-v269.yml'
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and unchanged current and saved payout rules
        run: |
          npm run check
          npm run test:dango
          node tests/dango-v269-presentation-rules.mjs
          node tests/dango-v269-lifecycle.mjs
      - name: BET ownership, edition isolation and offline cache versions
        run: |
          node tests/bet-layout-v269.mjs
          node tests/local-debug-v258.mjs
          node tests/local-sugar-v268-native.mjs
          node tests/recorded-round-v255.mjs
          node tests/download-v255-cache.mjs
          node tests/edition-choice-v255.mjs
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Japanese fonts and Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Compact payouts, yellow FREE icons and final-board reaches
        run: node tests/dango-v269-view.mjs
      - name: Preserved saved-game display
        run: node tests/dango-v266-view.mjs
      - name: BET-time roulette control and reclaimed main-game space
        if: ${{ !cancelled() }}
        run: node tests/bet-layout-v269-browser.mjs
      - name: Shared native BET controls and tab navigation
        if: ${{ !cancelled() }}
        run: node tests/tabs-v250-browser.mjs
      - name: Sugar panel still fits the full game layout
        if: ${{ !cancelled() }}
        run: node tests/sugar-challenge-v254-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dango-bet-v269-layout
          path: |
            qa-dango-v269-view/
            qa-dango-v266-view/
            qa-bet-layout-v269/
            qa-tabs-v250/
            qa-sugar-v254/
          retention-days: 7
  native-and-download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Japanese fonts and Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "SWEETS_DOWNLOAD_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Actual local roulette, manual numbers and eight-ball settlement
        run: node tests/local-debug-v258-browser.mjs
      - name: Native ten-game recording and deterministic settlement
        run: node tests/download-v255-compute.mjs
      - name: Offline replay, launch timing and server restart
        run: node tests/download-v255-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dango-bet-v269-native-and-download
          path: |
            qa-local-debug-v258/
            qa-download-v255/
          retention-days: 7
