name: Celebration imagery and casino audio v281
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/*v277*'
      - 'assets/audio/celebration-v277/**'
      - 'assets/audio/casino-v281/**'
      - 'assets/celebration-art-v277/**'
      - 'assets/arcade-candy-sfx-v158.js'
      - 'assets/arcade-candy-world-v15*.js'
      - 'assets/gelato-prism-v28.js'
      - 'assets/sugar-challenge-v254.js'
      - 'assets/download-assets-v255.json'
      - 'scripts/generate-celebration-audio-v277.py'
      - 'scripts/generate-casino-audio-v281.py'
      - 'index.html'
      - 'app-version.json'
      - 'tests/*v277*'
      - 'tests/casino-audio-v281.py'
      - '.github/workflows/celebration-v277.yml'
  push:
    branches: [main]
    paths:
      - 'assets/*v277*'
      - 'assets/audio/celebration-v277/**'
      - 'assets/audio/casino-v281/**'
      - 'assets/celebration-art-v277/**'
      - 'assets/arcade-candy-sfx-v158.js'
      - 'assets/arcade-candy-world-v15*.js'
      - 'assets/gelato-prism-v28.js'
      - 'assets/sugar-challenge-v254.js'
      - 'assets/download-assets-v255.json'
      - 'scripts/generate-celebration-audio-v277.py'
      - 'scripts/generate-casino-audio-v281.py'
      - 'index.html'
      - 'app-version.json'
      - 'tests/*v277*'
      - 'tests/casino-audio-v281.py'
      - '.github/workflows/celebration-v277.yml'
permissions:
  contents: read
jobs:
  presentation-contract-and-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Native event forwarding, state invariance, restore and render bounds
        run: node tests/award-presentation-v277.mjs
      - name: All ten production-rule witnesses
        run: node tests/award-fixtures-v277.mjs
      - name: Semantic audio routing, single award ownership, mute and pause
        run: node tests/celebration-audio-v277.mjs
      - name: All 97 casino and 41 fallback PCM cues, licensed layers, fades and content hashes
        run: python3 tests/celebration-audio-v277.py
      - name: Offline cache contains the new illustrated and audio resources
        run: node tests/download-v255-cache.mjs
  ten-game-award-display:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      CELEBRATION_QA_SHARD: ${{ matrix.shard }}
      CELEBRATION_QA_SHARDS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Japanese fonts and Chromium
        run: |
          if [ -z "$(fc-list :lang=ja family)" ]; then
            timeout 150s sudo bash -e -c '
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y fonts-noto-cjk
            '
          fi
          test -n "$(fc-list :lang=ja family)"
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            timeout 150s npx playwright install --with-deps chromium
            browser_path="$(node -p "require('playwright').chromium.executablePath()")"
          fi
          test -x "$browser_path"
          timeout 20s "$browser_path" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Actual manual final draws, illustrated awards, completed paths and sound
        run: node tests/celebration-v277-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celebration-v277-display-${{ matrix.shard }}
          path: qa-celebration-v277/
          retention-days: 7
  public-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [presentation-contract-and-audio, ten-game-award-display]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published runtime, artwork, 97 casino cues, licenses and 41 fallback cues
        run: node tests/celebration-v277-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celebration-v277-public
          path: qa-celebration-v277-public/report.json
          if-no-files-found: error
          retention-days: 7
