name: Celebration imagery and audio v277
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/*v277*'
      - 'assets/audio/celebration-v277/**'
      - 'assets/celebration-art-v277/**'
      - 'assets/arcade-candy-sfx-v158.js'
      - 'assets/arcade-candy-world-v15*.js'
      - 'assets/gelato-prism-v28.js'
      - 'assets/sugar-challenge-v254.js'
      - 'assets/download-assets-v255.json'
      - 'scripts/generate-celebration-audio-v277.py'
      - 'index.html'
      - 'app-version.json'
      - 'tests/*v277*'
      - '.github/workflows/celebration-v277.yml'
  push:
    branches: [main]
    paths:
      - 'assets/*v277*'
      - 'assets/audio/celebration-v277/**'
      - 'assets/celebration-art-v277/**'
      - 'assets/gelato-prism-v28.js'
      - 'assets/download-assets-v255.json'
      - 'scripts/generate-celebration-audio-v277.py'
      - 'index.html'
      - 'app-version.json'
      - 'tests/*v277*'
      - '.github/workflows/celebration-v277.yml'
permissions:
  contents: read
jobs:
  presentation-contract-and-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Native event forwarding, state invariance, restore and render bounds
        run: node tests/award-presentation-v277.mjs
      - name: All ten production-rule witnesses
        run: node tests/award-fixtures-v277.mjs
      - name: Semantic audio routing, single award ownership, mute and pause
        run: node tests/celebration-audio-v277.mjs
      - name: Original PCM duration, fades, headroom and content hashes
        run: python3 tests/celebration-audio-v277.py
      - name: Offline cache contains the new illustrated and audio resources
        run: node tests/download-v255-cache.mjs
  ten-game-award-display:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Japanese fonts and Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Actual manual final draws, illustrated awards, completed paths and sound
        run: node tests/celebration-v277-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celebration-v277-display
          path: qa-celebration-v277/
          retention-days: 7
