name: Final Six Candy rounds verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/six-candy-rounds-finish.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded update
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/tests/six_candy_rounds_20261026.py');s=p.read_text()
          a="Math.min(...roles[0].cells.map(p=>p[0]))===0"
          b="Math.min(...roles[0].cells.map(p=>p[0]))===Math.min(...q.sixPatterns(8).filter(p=>p.type==='hexagon').map(p=>Math.min(...p.cells.map(v=>v[0]))))"
          assert s.count(a)==1;p.write_text(s.replace(a,b))
          PY
          python .github/maintenance/install_six_candy_rounds_20261026.py
      - name: Install browser
        run: |
          pip install playwright >/tmp/six-final-browser.log 2>&1
          python -m playwright install --with-deps chromium >>/tmp/six-final-browser.log 2>&1 || { tail -60 /tmp/six-final-browser.log; exit 1; }
      - name: Verify rules, gravity, rounds and mobile layout
        run: python .github/tests/six_candy_rounds_20261026.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-candy-rounds-previews
          path: qa-six-rounds/
          retention-days: 3
          if-no-files-found: ignore
      - name: Save verified game and publish
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          note='''

          ## 追加更新: シックスキャンディのRound・役・落下（2026-10-26）
          - 第3タブを「シックスキャンディ」へ改名。BET中は盤面上部で7/8/9/10段（28/36/45/55個）を選択できる。他ゲーム/抽選機に影響せず、次ゲームも段数を保持。再読込は10段。各初期BET3000・BET20秒・既存発射と音声は維持。
          - 各盤面に1〜25の番号を別々のキャンディへ1個ずつ配置し残りは空白。新盤面も25番号すべてを使うが抽選自体は重複なしの8球。初期配置は特殊役と同色4連結のどちらも成立させない。
          - 落下は横と下の球・通過中の円の衝突を検査。支持1個では支持球の周りを円弧で転がり、下2段が空いていれば真下へ落下。行ごとの任意な左右反転を廃止し、下の行から動ける球だけを同時に移動。実際の処理と同じフレーム順で描画し、すり抜けや先着位置への飛びを抑える。
          - 原作Nintendo「6ボールパズル」の内部処理との完全一致は未確認。独自の近似であり原作コードを使っていない。調査参考: https://www.nintendo.com/jp/switch/as7ta/games/index.html と https://qiita.com/GANTZ/items/e6b5e9168b595404d582 。
          - ヘキサゴン→トライアングル→直線を優先し、同種は上から選ぶ。同じマスを2役に使用しない。三角形は上下両向き、直線は横と左右の斜め（3軸）で4個以上、最大連続1本を1役。役以外の同色4個以上も消去して連鎖するが直接配当なし。
          - 配当はゲーム内で独立に累計: HEX個数×0.5倍、TRI個数×0.3倍、LINE本数×0.1倍。旧連鎖倍率は廃止。全消しした盤面ごとに追加60倍を一度付与（通常連結だけの全消しも対象）。
          - 有配当の役または全消しが成立したHITからの連鎖を最後まで終えた後に次のRoundへ。通常連結だけでは同じ盤面を継続。共通8球の残りを次盤面で処理し、8球目後は不要な次盤面を作らずリザルト。次のBETはRound1。暫定色数はRound1〜2:5色、3〜4:4色、5以降:3色（共通デバッグ色数が上限）。
          - HEX達成の通常シュガーは1ゲーム1個を維持。大型吹き出しと3倍/10倍強調、上の黒帯を覆わない配置を維持。右の役別配当表/Round/残数/リザルトを更新。前チャットの生成PNGは今回未組込で、既存の専用キャンディ描画を使用。
          - Chromium検証: 216初期配置の25番号一意性/空白/初期4連結なし、36盤面の落下時数保存/7,241時点の通過経路と同時移動の非重複/安定、上下三角形/3軸直線/役優先とマス重複なし、配当/60倍/予測一致、12シード8球・強制役によるRoundと5→4→3色進行、0BET/途中リセット/シュガー一度/3種同時集計とCREDIT一度、段数選択の非干渉、スマホ3サイズ/横画面/PC・吹き出しと黒帯非重複を確認。配当バランスは未調整。
          - 未検証: 原作実機との完全一致、iPhone実機、自然物理の全8球、今回の音声聴感。テストの着弾は制御した番号通知。既存2ゲーム/物理/音声のソースは不変確認。
          - 編集元: assets/six-candy-rounds-engine.js / six-candy-rounds-ui.js / six-candy-rounds.css。assets/six-candy.jsとindex.htmlへ組込。検証: .github/tests/six_candy_rounds_20261026.py。
          '''
          note='\n'.join(line.strip() for line in note.splitlines())+'\n- 最新index.html blob: `'+sha+'`。\n'
          p=Path('HANDOFF.md');p.write_text(p.read_text()+note);print('VERIFIED_SIX_CANDY_ROUNDS_BLOB',sha)
          PY
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/six-candy-rounds-install.yml .github/workflows/six-candy-rounds-finish.yml
          git add index.html HANDOFF.md assets/six-candy.js .github/tests/six_candy_rounds_20261026.py
          git commit -m 'Publish Six Candy rounds, collision-aware gravity and independent role payouts'
          git push origin HEAD:main
