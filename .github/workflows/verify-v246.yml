name: v246 incremental forecasts and hidden client result/payout
on:
  workflow_dispatch:
  push:
    branches: ['feature/progressive-background-v246']
    paths:
      - 'assets/**'
      - 'server-core-loader-v220.mjs'
      - 'server-stations-v235.mjs'
      - 'index.html'
      - 'tests/**v246.mjs'
      - 'tests/monitor-ledger-v241.mjs'
      - '.github/workflows/verify-v246.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and incremental cached forecasts
        run: |
          npm run check
          node --check assets/stations-progressive-v246.js
          node --check assets/shared-client-hidden-v246.js
          node tests/progressive-forecast-v246.mjs
          node tests/monitor-ledger-v241.mjs
          node tests/monitor-ledger-integration-v241.mjs
      - name: Background payout and existing guarantees
        run: |
          node tests/hidden-results-v246.mjs
          node tests/background-continuity-v240.mjs
          node tests/stations-detail-v238.mjs
          node tests/stations-highlight-v239.mjs
          node tests/client-forecast-v243.mjs
      - name: Full shared roulette and wallet regression
        run: npm run test:shared
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Actual nine-game shared client and monitor
        run: node tests/client-browser-v243.mjs
      - name: Hidden nine-game end-to-end result, payout and next BET
        run: node tests/client-hidden-browser-v246.mjs
