name: CookieLink reach contrast update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cookie-link-reach-20261025.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Inspect in-board lettering colors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('index.html').read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert sha=='60eb120ea40ccc4e86003ff9244fab756f69d875'
          for i,line in enumerate(raw.decode().splitlines()):
              if i>1900:break
              if any(k in line for k in ['.tile-reach','.reach-first','.reach-second','reach-text','reach-label','reach-ink']):
                  print(str(i+1)+': '+line[:5000])
          PY
