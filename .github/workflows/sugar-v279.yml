name: Sugar current entry rules and transparent artwork v279
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/sugar-*'
      - 'assets/sugar-art-v279/**'
      - 'assets/sugar-art-v270/**'
      - 'assets/local-sugar-v267.js'
      - 'assets/local-debug-game-v258.js'
      - 'assets/download-*'
      - 'assets/recorded-round-v255.js'
      - 'assets/edition-choice-v255.js'
      - 'server-sugar-*.mjs'
      - 'server-download-*.mjs'
      - 'server-payout-preload-v3.mjs'
      - 'optimized/app-01.js'
      - 'index.html'
      - 'app-version.json'
      - 'download-sw-v255.js'
      - 'tests/sugar-*'
      - 'tests/local-sugar-*'
      - 'tests/local-debug-v258.mjs'
      - 'tests/download-v255-*'
      - 'tests/sixdrop-v278-settlement.mjs'
      - 'tests/ui-v250-fixture.mjs'
      - 'scripts/sugar-challenge-v271-probabilities.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sugar-v279.yml'
  push:
    branches: [main]
    paths:
      - 'assets/sugar-*'
      - 'assets/sugar-art-v279/**'
      - 'assets/sugar-art-v270/**'
      - 'assets/local-sugar-v267.js'
      - 'assets/local-debug-game-v258.js'
      - 'assets/download-*'
      - 'assets/recorded-round-v255.js'
      - 'assets/edition-choice-v255.js'
      - 'server-sugar-*.mjs'
      - 'server-download-*.mjs'
      - 'server-payout-preload-v3.mjs'
      - 'optimized/app-01.js'
      - 'index.html'
      - 'app-version.json'
      - 'download-sw-v255.js'
      - 'tests/sugar-*'
      - 'tests/local-sugar-*'
      - 'tests/local-debug-v258.mjs'
      - 'tests/download-v255-*'
      - 'tests/sixdrop-v278-settlement.mjs'
      - 'tests/ui-v250-fixture.mjs'
      - 'scripts/sugar-challenge-v271-probabilities.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sugar-v279.yml'
permissions:
  contents: read
jobs:
  rules-and-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Changed runtime and verification syntax
        run: |
          node --check assets/sugar-challenge-rules-v254.js
          node --check assets/sugar-challenge-v254.js
          node --check assets/local-sugar-v267.js
          node --check assets/download-mode-v255.js
          node --check assets/recorded-round-v255.js
          node --check assets/download-worker-v255.js
          node --check server-sugar-challenge-v254.mjs
          node --check server-payout-preload-v3.mjs
          node --check tests/sugar-v279-public.mjs
      - name: Unstarted Sugar migration, native local payout and authoritative server boundaries
        run: node tests/sugar-v279-migration.mjs
      - name: Current and saved Sugar rules, JPC entry and exact probabilities
        run: |
          node tests/sugar-challenge-v254-rules.mjs
          node tests/sugar-challenge-v268-rules.mjs
          node tests/sugar-v270-rules.mjs
          node tests/sugar-v271-rules.mjs
          node scripts/sugar-challenge-v271-probabilities.mjs --check
      - name: Local owner, restored histories and current loader cache pins
        run: |
          node tests/local-sugar-v267.mjs
          node tests/local-sugar-v268-native.mjs
          node tests/local-debug-v258.mjs
      - name: Sugar ledger, server settlement and roulette compatibility
        run: |
          node tests/sugar-challenge-v254-ledger.mjs
          node tests/sugar-challenge-v254-server.mjs
          node tests/sugar-roulette-v254.mjs
          node tests/sugar-roulette-v268.mjs
      - name: Deterministic reel and payout presentation
        run: node tests/sugar-v270-presentation.mjs
      - name: Shared payout bridge preserves Six Drop settlement
        run: node tests/sixdrop-v278-settlement.mjs
      - name: Offline asset manifest includes the current runtime and artwork
        run: node tests/download-v255-cache.mjs
  native-browser-display:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: transparent-art
            script: tests/sugar-v279-browser.mjs
            output: qa-sugar-v279
          - suite: sugar-panel
            script: tests/sugar-challenge-v254-browser.mjs
            output: qa-sugar-v254
    env:
      SWEETS_QA_OUTPUT_DIR: ${{ matrix.output }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Installed Chrome and Japanese fonts on the pinned runner
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser_path"
          test -x "$browser_path"
          timeout 20s "$browser_path" --version
          if [ -z "$(fc-list :lang=ja family)" ]; then
            timeout 360s sudo env DEBIAN_FRONTEND=noninteractive bash -e -c '
              apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
              apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends fonts-noto-cjk
            '
          fi
          test -n "$(fc-list :lang=ja family)"
          echo "PLAYWRIGHT_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Real Sugar artwork, JPC display and preserved native state
        id: browser
        run: node ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.browser.outcome != 'skipped'
        with:
          name: sugar-v279-${{ matrix.suite }}
          path: ${{ matrix.output }}/
          if-no-files-found: error
          retention-days: 7
  download-offline-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Installed Chrome and Japanese fonts on the pinned runner
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser_path"
          test -x "$browser_path"
          timeout 20s "$browser_path" --version
          if [ -z "$(fc-list :lang=ja family)" ]; then
            timeout 360s sudo env DEBIAN_FRONTEND=noninteractive bash -e -c '
              apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update -qq
              apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends fonts-noto-cjk
            '
          fi
          test -n "$(fc-list :lang=ja family)"
          echo "PLAYWRIGHT_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          echo "SWEETS_DOWNLOAD_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Real recording, offline resume, eight-ball completion and exactly-once credit
        id: browser
        run: node tests/download-v255-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.browser.outcome != 'skipped'
        with:
          name: sugar-v279-download-offline
          path: qa-download-v255/
          if-no-files-found: error
          retention-days: 7
  public-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rules-and-migration, native-browser-display, download-offline-resume]
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published Sugar runtime, transparent art, unchanged reel art and offline cache
        run: node tests/sugar-v279-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sugar-v279-public
          path: qa-sugar-v279-public/
          if-no-files-found: error
          retention-days: 7
