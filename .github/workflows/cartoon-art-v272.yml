name: Cartoon game artwork v272
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/cartoon-*'
      - 'assets/cartoon-art-v272/**'
      - 'assets/gelato-prism-v28.js'
      - 'assets/winery-pyramid-v1.js'
      - 'assets/popcorn-view.js'
      - 'assets/jelly-view.js'
      - 'assets/bingo-stick-view.js'
      - 'assets/party-castella.js'
      - 'assets/dango-bingo-view.js'
      - 'assets/demo-suite-v91.js'
      - 'assets/jelly-lesson.js'
      - 'assets/waffle-lesson.js'
      - 'assets/castella-lesson.js'
      - 'assets/download-assets-v255.json'
      - 'index.html'
      - 'app-version.json'
      - 'tests/cartoon-art-v272-browser.mjs'
      - '.github/workflows/cartoon-art-v272.yml'
permissions:
  contents: read
jobs:
  art-and-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax, preserved payouts, and current Sugar rules
        run: |
          node --check assets/cartoon-art-v272.js
          node --check assets/cartoon-boards-a-v272.js
          node --check assets/cartoon-boards-b-v272.js
          node --check assets/cartoon-boards-c-v272.js
          node --check assets/demo-suite-v91.js
          node --check assets/jelly-lesson.js
          node --check assets/waffle-lesson.js
          node --check assets/castella-lesson.js
          npm run check
          npm run test:payout
          npm run test:sugar
      - name: Versioned offline assets
        run: node tests/download-v255-cache.mjs
  ten-games:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Japanese fonts and Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: All ten boards, miniatures, generated artwork, and stable state
        run: node tests/cartoon-art-v272-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartoon-v272-ten-games
          path: qa-cartoon-v272/
          retention-days: 7
