name: CookieLink sweets result and JPC
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cookie-link-result-jpc-20261025.yml']
permissions:
  contents: write
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded UI and lifecycle patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/maintenance/result_jpc_20261025.py');s=p.read_text()
          s=s.replace('replace(old,new)','replace(old.lstrip(),new.lstrip())',1)
          s=s.replace("hits.length>jpcSession.previousHits&&!document.hidden&&!menuOpen&&!app.paused","hits.length>jpcSession.previousHits&&!document.hidden&&!menuOpen&&!userPaused&&inView")
          p.write_text(s)
          PY
          python3 .github/maintenance/result_jpc_20261025.py
      - name: Install isolated browser checks
        run: |
          npm install --prefix /tmp/cookielink-browser --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/cookielink-browser/node_modules/.bin/playwright install chromium
      - name: Check normal gameplay and results plus JPC isolation
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/cookielink-result-server.log 2>&1 &
          node .github/tests/cookie-link-result-jpc.cjs
      - name: Record verified update and save
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          p=Path('HANDOFF.md');s=p.read_text()
          s+='\n## 追加更新: お菓子の国リザルト・15秒BET・暫定JPC（2026-10-25）\n'
          s+='- 最新 index.html blob: `'+sha+'`。旧SHAより優先。\n'
          s+='- リザルトはキャンディ・ビスケット・旗のフレーム、中央上部の大きなTOTAL WIN、下段3枚のゲーム結果カード。既存の菓子世界画像/ロゴ/クッキーを使用し、全体→カードの段階的な出現。画面参考は配置と雰囲気を反映。\n'
          s+='- リザルトは表示開始から有効表示時間8秒（暫定）で自動的に次ゲームへ。ただし払い出し完了より前には進めず、CREDIT加算は従来の一度のみ。非表示タブ・メニュー・内部一時停止中は時間を進めない。即リセット/モード変更で古い遷移タイマーを破棄。\n'
          s+='- BETタイムは15秒。右上に暫定「すぐ開始」ボタン、JPCモード切替、既存の即リセット。1秒自動開始は解除。?demo=1の説明確認用BET延長だけ維持。\n'
          s+='- JPCモードは既存3D抽選機の70球機能を使用。通常ゲームのBET中/払い出し完了後に切替可能。実際のjpcCountsとphysics.hitsから25ポケットの球数、発射数、入賞数、24ポケットのリーチと25ポケットのJP、直近入賞番号を下画面へ表示。\n'
          s+='- JPC中は通常Engineを止め、通常の抽選番号・CREDIT・BET・獲得済みシュガー・保存成績には加算しない。物理モデルは変更なし。通常8球用の救済再発射条件をeightモードのみに限定。右上の通常モードで15秒BETへ戻る。JPC終了後は状況確認用に保持し、「もう一度」または通常モードで進む。\n'
          s+='- 検証: JS構文、45パターンの8球結果/乱数使用数の一致、320/390/430px縦画面・844x390横画面・1280x900PCで枠/文字/25ポケットの収まり、BET15秒/即開始/リザルト8秒/一度のみ払い出し/リセット取消、既存JPCドライバの入賞コールバック連動・24/25ポケット・70球制限・通常成績の不変を確認。\n'
          s+='- 未検証: iPhone実機、スピーカー聴感、JPC実時間70球の全軌道。テストで入賞イベントを注入した確認を実球70球通しプレイと表現しない。新規BGM素材の追加はしていない。\n'
          p.write_text(s);print('VERIFIED_RESULT_JPC_BLOB',sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html HANDOFF.md .github/maintenance/result_jpc_20261025.py
          git commit -m 'Add sweets result ceremony automatic BET cycle and isolated JPC dashboard'
          git push origin HEAD:main
