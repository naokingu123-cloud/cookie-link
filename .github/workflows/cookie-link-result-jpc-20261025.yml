name: CookieLink sweets result and JPC
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cookie-link-result-jpc-20261025.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect lifecycle and layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ls=Path('index.html').read_text().splitlines()
          ranges=[(1520,1539),(1900,2042),(2044,2070),(3740,3765),(4068,4120),(4434,4460),(4815,4895),(4935,5053),(5190,5269)]
          for start,end in ranges:
              for i in range(start-1,min(end,len(ls))):
                  if len(ls[i])<6000:print(str(i+1)+': '+ls[i])
          for i,l in enumerate(ls):
              if len(l)<6000 and any(k in l for k in ['payoutStamp','payoutFrame','advanceResult(','advancePayout(','#bet-countdown','#debug-reset','function select(','function updateUI(','function ui(']):print(str(i+1)+': '+l)
          PY
