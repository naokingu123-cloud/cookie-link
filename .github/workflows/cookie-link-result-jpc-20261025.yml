name: CookieLink sweets result and JPC
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cookie-link-result-jpc-20261025.yml']
permissions:
  contents: write
jobs:
  final-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Fit result totals without changing the game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess,tempfile
          p=Path('index.html');raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='dee66da49dc4151b5551b5e3fd40cdd2045a83e1','Source changed; refusing to overwrite'
          Path('/tmp/cookielink-before.html').write_bytes(raw);s=raw.decode()
          def replace(a,b):
              global s
              assert s.count(a)==1,a[:120]
              s=s.replace(a,b,1)
          replace('.result-total-amount{display:flex;','.result-total-amount{width:100%;display:flex;')
          replace("fitGoldenNumber($('result-total-win'),num(a.totalWin),52,250);","fitResultTotal(a);")
          replace('function renderRoundResult(a){',"function fitResultTotal(a){const el=$('result-total-win'),width=Math.max(72,Math.min(250,el.parentElement.clientWidth-64));fitGoldenNumber(el,num(a.totalWin),52,width);}\nfunction renderRoundResult(a){")
          replace("document.documentElement.style.setProperty('--game-viewport-height',h+'px');positionJpcDashboard();","document.documentElement.style.setProperty('--game-viewport-height',h+'px');positionJpcDashboard();if(app?.result&&!$('round-result-layer').hidden)fitResultTotal(app);")
          p.write_text(s)
          with tempfile.TemporaryDirectory() as folder:
              for i,m in enumerate(re.finditer(r'<script\b([^>]*)>([\s\S]*?)</script>',s)):
                  attrs,code=m.groups()
                  if not code.strip() or re.search(r'type=[\"\x27](?:application/json|importmap)',attrs):continue
                  f=Path(folder)/('s'+str(i)+('.mjs' if 'module' in attrs else '.js'));f.write_text(code);subprocess.run(['node','--check',str(f)],check=True)
          p=Path('.github/tests/cookie-link-result-jpc.cjs');s=p.read_text()
          a='await page.waitForTimeout(800);'
          b="await page.waitForTimeout(100);await page.evaluate(()=>{for(const a of document.querySelector('#round-result-layer').getAnimations({subtree:true})){if(a.effect.getTiming().iterations!==Infinity)a.finish();}});"
          assert s.count(a)==1;s=s.replace(a,b,1)
          a="'.result-countdown-track','#result-total-win']);"
          b="'.result-countdown-track','#result-total-win','.result-total .win-word']);"
          assert s.count(a)==1;s=s.replace(a,b,1)
          a="inside(rs['#result-total-win'],rs['.result-total'],'Total number too wide');"
          b=a+"inside(rs['.result-total .win-word'],rs['.result-total'],'WIN label clipped');"
          assert s.count(a)==1;s=s.replace(a,b,1);p.write_text(s)
          print('FINAL_RESULT_SIZE_PATCH_OK')
          PY
      - name: Install isolated browser checks
        run: |
          npm install --prefix /tmp/cookielink-browser --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/cookielink-browser/node_modules/.bin/playwright install chromium
      - name: Recheck actual final layout, timing and JPC
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/cookielink-final-server.log 2>&1 &
          node .github/tests/cookie-link-result-jpc.cjs
      - name: Save verified final fit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          p=Path('HANDOFF.md');p.write_text(p.read_text()+'\n### リザルト表示の最終調整\n- 最新 index.html blob: `'+sha+'`。総獲得数を実際の表示枠幅に合わせ、縦横切替でも再計算。\n- 登場アニメーションの途中ではなく最終フレームでも、5画面サイズで枠・数字・WIN表記の収まりを再確認。45ケースの通常ゲーム比較とBET15秒/リザルト8秒/JPC検証も再実施。\n')
          print('FINAL_RESULT_JPC_BLOB',sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html HANDOFF.md .github/tests/cookie-link-result-jpc.cjs
          git commit -m 'Fit large result totals and verify final animation frames across screen sizes'
          git push origin HEAD:main
