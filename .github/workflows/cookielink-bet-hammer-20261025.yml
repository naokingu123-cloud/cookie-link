name: CookieLink checked presentation update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cookielink-bet-hammer-20261025.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Patch verified source and validate scripts
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,re,subprocess,tempfile
          path=pathlib.Path('index.html');raw=path.read_bytes()
          def blob(raw):return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob(raw)=='a744d9b8677e0e262f4931b30ebde59589c7ab79','Source changed; no overwrite'
          text=raw.decode('utf-8');original=text
          pathlib.Path('/tmp/cookielink-before.html').write_text(text,encoding='utf-8')
          changes=[]
          def replace(old,new):
              global text
              assert text.count(old)==1,'Unique anchor missing: '+old[:120]
              changes.append((old,new));text=text.replace(old,new,1)
          replace('''function refillItemTiming(r,c,index){
           const distance=(r+.5)*CELL+24,release=280+c*6+index*46,fall=Math.ceil(Math.sqrt(2*distance/.0036));
           return {distance,release,fall,end:release+fall+110};
          }''','''const REFILL_COLUMN_STAGGER_MS=100;
          function refillItemTiming(r,c,index,speed=1){
           const distance=(r+.5)*CELL+24,release=280+c*REFILL_COLUMN_STAGGER_MS*speed+index*46,fall=Math.ceil(Math.sqrt(2*distance/.0036));
           return {distance,release,fall,end:release+fall+110};
          }
          // Engine.wait divides by speed; keep the normal-play column gap at 100 ms.
          function refillWait(cells,speed){
           const lastColumn=cells.reduce((last,cell)=>Math.max(last,cell[1]),0);
           return REFILL_WAIT+lastColumn*REFILL_COLUMN_STAGGER_MS*speed;
          }''')
          replace('this.processed=0;this.accepted=0;this.busy=false;this.running=false;this.paused=false;','this.processed=0;this.accepted=0;this.busy=false;this.running=false;this.opening=false;this.paused=false;')
          replace(" start(){this.running=true;this.emit('waiting');}",''' start(){
            if(this.running)return;
            this.running=true;this.busy=true;this.opening=true;
            const cells=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(this.board[r][c])cells.push([r,c]);
            this.openBoard(this.version,cells);
           }
           async openBoard(token,cells){
            try{
             const duration=refillWait(cells,this.speed);
             this.emit('refill',{initial:true,freshCells:cells,stepCells:[],adjustedCells:[],duration:duration/this.speed});
             if(!await this.wait(duration,token))return;
             this.opening=false;this.busy=false;this.emit('waiting');
             // Draws may arrive during delivery; keep them in their original order.
             if(this.queue.length)this.drain();
            }catch(error){
             if(token===this.version){this.opening=false;this.busy=false;this.running=false;this.queue=[];this.emit('error',{message:error.message});}
            }
           }''')
          replace("    this.fill();this.emit('refill',{number,ball,depth,stepCells:this.spawnedSteps,adjustedCells:this.refillAdjusted});if(!await this.wait(REFILL_WAIT,token))return;",'''    const refillCells=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!this.board[r][c])refillCells.push([r,c]);
              this.fill();const refillDuration=refillWait(refillCells,this.speed);
              this.emit('refill',{number,ball,depth,stepCells:this.spawnedSteps,adjustedCells:this.refillAdjusted,freshCells:refillCells,duration:refillDuration/this.speed});
              if(!await this.wait(refillDuration,token))return;''')
          replace("basket.style.setProperty('--pour-delay',c*6/e.speed+'ms');","basket.style.setProperty('--pour-delay',c*REFILL_COLUMN_STAGGER_MS+'ms');")
          replace("basket.style.setProperty('--return-delay',(c*6+lastRelease+160)/e.speed+'ms');","basket.style.setProperty('--return-delay',(c*REFILL_COLUMN_STAGGER_MS+(lastRelease+160)/e.speed)+'ms');")
          replace('timing=refillItemTiming(p.r,c,j),angle=','timing=refillItemTiming(p.r,c,j,e.speed),angle=')
          replace(' for(const [id,el] of s.tiles)if(!alive.has(id)){el.remove();s.tiles.delete(id);}', ''' if(ev.phase==='refill'&&ev.initial){
            fresh.length=0;
            for(const [r,c] of ev.freshCells||[]){const t=e.board[r][c];if(t)fresh.push({r,c,t});}
           }
           for(const [id,el] of s.tiles)if(!alive.has(id)){el.remove();s.tiles.delete(id);}''')
          reverted=text
          for before,after in reversed(changes):
              assert reverted.count(after)==1
              reverted=reverted.replace(after,before,1)
          assert reverted==original,'Unexpected changes'
          with tempfile.TemporaryDirectory() as folder:
              for i,m in enumerate(re.finditer(r'<script\b([^>]*)>([\s\S]*?)</script>',text)):
                  attrs,code=m.groups()
                  if not code.strip() or re.search(r'type=[\"\x27](?:application/json|importmap)',attrs):continue
                  p=pathlib.Path(folder)/('script'+str(i)+('.mjs' if 'module' in attrs else '.js'))
                  p.write_text(code,encoding='utf-8');subprocess.run(['node','--check',str(p)],check=True)
          path.write_bytes(text.encode('utf-8'));print('PATCH_BLOB',blob(path.read_bytes()))
          PY
      - name: Install isolated browser tests
        run: |
          npm install --prefix /tmp/cookielink-browser --no-save --no-audit --no-fund playwright@1.56.1
          /tmp/cookielink-browser/node_modules/.bin/playwright install chromium
      - name: Test fill timing and unchanged eight-ball results
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/cookielink-server.log 2>&1 &
          node <<'JS'
          const fs=require('fs'),assert=require('assert/strict');
          const {chromium}=require('/tmp/cookielink-browser/node_modules/playwright');
          const anchor='app=new Arcade({onEvent:recordEvent,onChange:recordChanged});app.drawSource=rouletteDrawSource;select(0);';
          const before=fs.readFileSync('/tmp/cookielink-before.html','utf8'),after=fs.readFileSync('index.html','utf8');
          async function open(browser,source,viewport){
            const extra=source.includes('function refillWait(')?',refillWait':'';
            const hook='window.__clTest={get app(){return app},slots,select,render,pour,Engine,refillItemTiming,updateWonderHud,syncBetPreview'+extra+'};userPaused=true;app.paused=true;';
            assert.equal(source.split(anchor).length,2);
            const page=await browser.newPage({viewport});const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.route('**/index.html',route=>route.fulfill({status:200,contentType:'text/html; charset=utf-8',body:source.replace(anchor,anchor+hook)}));
            await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__clTest&&document.querySelectorAll('#hammer-pay tr').length===5,{},{timeout:20000});
            return {page,errors};
          }
          async function simulate(page){return await page.evaluate(async()=>{
            const results=[];
            for(const colorCount of [3,4,5])for(const speed of [1,1.4,2])for(let seed=1;seed<=5;seed++){
              let rng=seed*997+colorCount*19,calls=0;
              const random=()=>{calls++;rng=(Math.imul(rng,1664525)+1013904223)>>>0;return rng/4294967296;};
              let finish,fail;const done=new Promise((resolve,reject)=>{finish=resolve;fail=reject;});
              const e=new window.__clTest.Engine({random,speed,colorCount,sleep:()=>Promise.resolve(),onEvent:ev=>{if(ev.phase==='complete')finish();if(ev.phase==='error')fail(Error(ev.message));}});
              const numbers=Array.from({length:8},(_,i)=>(seed+i*3)%25+1);
              e.start();for(const n of numbers)if(!e.enqueue(n))throw Error('Queue rejected draw');
              await done;
              results.push({colorCount,speed,seed,calls,rng,processed:e.processed,accepted:e.accepted,board:e.board,hammerPreview:e.hammerPreview,hammerQueue:e.hammerQueue,basketState:e.basketState,wonderToken:e.wonderToken,wonderCollected:e.wonderCollected,roundSteps:e.roundSteps,roundHammers:e.roundHammers,roundCleared:e.roundCleared,maxLink:e.maxLink,maxChain:e.maxChain,totalHundredths:e.totalHundredths,allClears:e.allClears});
            }
            return results;
          });}
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            try{
              const old=await open(browser,before,{width:430,height:932});const expected=await simulate(old.page);assert.deepEqual(old.errors,[]);await old.page.close();
              const current=await open(browser,after,{width:430,height:932});const actual=await simulate(current.page);assert.deepEqual(actual,expected,'Seeded eight-ball outcomes or random draws changed');assert.deepEqual(current.errors,[]);await current.page.close();
              console.log('EIGHT_BALL_REGRESSION_PASSED',actual.length,'cases including draws queued during initial delivery');
              for(const viewport of [{width:430,height:932},{width:1280,height:900}]){
                const {page,errors}=await open(browser,after,viewport);
                const checks=await page.evaluate(async()=>{
                  const t=window.__clTest,a=t.app,passed=[];
                  const check=(ok,msg)=>{if(!ok)throw Error(msg);passed.push(msg);};
                  for(const speed of [.75,1,1.4,2])for(let r=0;r<8;r++)for(let index=0;index<8;index++){
                    const first=t.refillItemTiming(r,0,index,speed).release/speed;
                    for(let c=0;c<8;c++)check(Math.abs(t.refillItemTiming(r,c,index,speed).release/speed-first-c*100)<1e-7,'column-gap');
                  }
                  const all=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)all.push([r,c]);
                  for(const speed of [.75,1,1.4,2])for(const c of [0,3,7])for(let length=1;length<=8;length++){
                    const cells=Array.from({length},(_,i)=>[i,c]);const wait=t.refillWait(cells,speed);
                    for(let j=0;j<length;j++)check(wait>=t.refillItemTiming(length-1-j,c,j,speed).end,'wait-covers-last-landing');
                    check(wait>=280+(length-1)*46+320+c*100*speed,'wait-covers-basket-return');
                  }
                  a.drawSource={ready:true,start(){},pause(){},reset(){}};check(a.start(),'start accepted');a.pause(true);
                  const s=t.slots[0],e=a.engines[0];t.select(0);t.render(s,s.event,e,true);t.updateWonderHud(a,s,e,a.bet(0));
                  check(e.opening&&e.busy&&e.phase==='refill','initial delivery is gated');
                  check(!document.querySelector('#hammer-pay .hammer-unknown'),'hammer colors reveal at start, before delivery completes');
                  check(s.deliveryLayer.querySelectorAll('.refill-flight').length===64,'all 64 initial cookies delivered');
                  const delay=c=>parseFloat(s.tiles.get(e.board[7][c].id).style.getPropertyValue('--supply-delay'));
                  for(let c=1;c<8;c++)check(Math.abs(delay(c)-delay(0)-c*100)<.001,'initial column '+c);
                  check(a.acceptNumber(1,a.token)===false,'paused draw rejected by Arcade');
                  e.paused=false;check(e.enqueue(1),'early hit queued');e.paused=true;check(e.processed===0&&e.queue[0]===1,'hit waits for initial delivery');
                  a.prepare();a.paused=true;check(a.engines.every(x=>!x.opening&&!x.busy&&!x.running&&x.phase==='ready'),'reset cancels initial delivery');
                  t.select(0);t.updateWonderHud(a,s,a.engines[0],a.bet(0));check(!!document.querySelector('#hammer-pay .hammer-unknown'),'BET conceals colors again');
                  const ee=a.engines[0],cells=[];
                  for(let r=0;r<3;r++)for(let c=0;c<8;c++){ee.board[r][c]=null;cells.push([r,c]);}
                  ee.fill();t.render(s,{phase:'refill',freshCells:cells},ee,true);
                  const refillDelay=c=>parseFloat(s.tiles.get(ee.board[2][c].id).style.getPropertyValue('--supply-delay'));
                  for(let c=1;c<8;c++)check(Math.abs(refillDelay(c)-refillDelay(0)-c*100)<.001,'refill column '+c);
                  for(let c=0;c<8;c++)check(parseFloat(s.baskets[c].style.getPropertyValue('--pour-delay'))===c*100,'basket column '+c);
                  let resolveSleep;const q=new t.Engine({random:()=>.37,sleep:()=>new Promise(resolve=>{resolveSleep=resolve;})});
                  q.start();q.enqueue(2);q.paused=true;const oldVersion=q.version;q.reset();resolveSleep();await Promise.resolve();await Promise.resolve();
                  check(q.version!==oldVersion&&q.phase==='ready'&&!q.busy&&!q.running&&!q.queue.length,'old delivery cannot revive after reset');
                  return passed.length;
                });
                assert.deepEqual(errors,[],'No uncaught browser errors');console.log('UI_TIMING_TESTS_PASSED',JSON.stringify(viewport),checks);await page.close();
              }
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
      - name: Record validation and commit
        run: |
          python3 - <<'PY'
          import pathlib,hashlib
          raw=pathlib.Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          p=pathlib.Path('HANDOFF.md');text=p.read_text(encoding='utf-8')
          text+='\n## 追加更新: 左から0.1秒ずつの補充（2026-10-25）\n'
          text+='- 最新 `index.html` blob: `'+sha+'`。以前のSHAよりこちらを優先。\n'
          text+='- メイン盤面の開始時充填と通常補充は左列から0.1秒間隔。右端は左端より0.7秒遅れて上から補充。列差は標準のspeed=1.4でも0.1秒になるよう補正。従来の終盤早送り倍率は維持。\n'
          text+='- バスケットの傾き・クッキー放出・戻りを同じ列タイミングに同期。最後の着地とバスケット復帰までEngineが待つ。\n'
          text+='- 開始時は既に生成された同じ盤面を表示演出するだけ。再生成しない。充填中の入賞は順序どおりキューに保留し、完了後に処理。中断・リセットは世代トークンで取り消す。\n'
          text+='- ハンマーのBET色非公開と消去後200msの追加待機は維持。物理、抽選、配当、音声ファイルは変更なし。\n'
          text+='- 検証: JS構文、変更前後45ケース（3色数×3速度×5seed）の8球結果・盤面・ハンマー・シュガー・乱数使用数一致。Chromium 430x932/1280x900で64マス開始充填、通常補充、0.1秒列差、0.7秒右端差、補充完了待機、早着入賞、リセット取消を検証。iPhone実機と音声の聴感は未検証。\n'
          text+='- 小盤面の通常プレイ補充アニメーション強化や、その他のデモ/UI/BGM追加依頼はこの更新では未実装。\n'
          p.write_text(text,encoding='utf-8');print('VERIFIED_GAME_BLOB',sha)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html HANDOFF.md
          git commit -m 'Deliver initial and refill cookies left to right with 100 ms column spacing'
          git push origin HEAD:main
