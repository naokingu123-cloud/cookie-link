name: CookieLink BET hammer checked update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cookielink-bet-hammer-20261025.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shared refill timings and initial dealing
        run: |
          python3 - <<'PY'
          import pathlib,hashlib
          raw=pathlib.Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert sha=='a744d9b8677e0e262f4931b30ebde59589c7ab79'
          lines=raw.decode('utf-8').splitlines()
          rules=[('refillItemTiming',7),('refillDuration',10),('class Engine',70),('start(){',15),("phase:'refill'",10),("emit('refill'",12),('function pour(',34),('function paintMini',65),('function event(',35),('refillDuration',6),('initialFill',12),('function mini',60),('function sugarState',12)]
          keep=set()
          for i,line in enumerate(lines):
              if len(line)>12000:continue
              for needle,after in rules:
                  if needle in line:keep.update(range(max(0,i-2),min(len(lines),i+after)))
          print('SOURCE_BLOB',sha)
          for i in sorted(keep):
              if len(lines[i])<12000:print(str(i+1)+': '+lines[i])
          PY
