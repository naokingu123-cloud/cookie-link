name: v246 smooth video, progressive forecasts and hidden completion
on:
  workflow_dispatch:
  push:
    branches: ['feature/client-smooth-v246']
    paths:
      - 'scripts/apply-client-smooth-v246.mjs'
      - 'assets/client-render-patch-v246.js'
      - 'tests/client-smooth-v246.mjs'
      - 'tests/client-hidden-browser-v246.mjs'
      - '.github/workflows/smooth-v246.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply visual-only and continuation fixes
        run: node scripts/apply-client-smooth-v246.mjs
      - name: Progressive previews and native timing assertions
        run: |
          npm run check
          node tests/progressive-forecast-v246.mjs
          node tests/hidden-results-v246.mjs
          node tests/background-continuity-v240.mjs
          node tests/monitor-ledger-v241.mjs
          node tests/monitor-ledger-integration-v241.mjs
          node tests/client-smooth-v246.mjs
      - name: Existing shared video, bet, wallet and reconnect behavior
        run: npm run test:shared
      - name: Browser dependencies
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Actual nine-game client and forced BET rejoin
        run: node tests/client-browser-v243.mjs
      - name: Hidden native result and payout
        run: node tests/client-hidden-browser-v246.mjs
      - name: Monitor layout remains single-row and no-scroll
        run: node tests/monitor-layout-v242.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v246-smooth-qa
          path: |
            qa-client-v243
            qa-monitor-v242
          retention-days: 3
      - name: Save verified runtime only to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/shared-roulette-client-v224.js assets/shared-client-background-v240.js assets/shared-client-hidden-v246.js index.html monitor.html app-version.json docs/client-v243-qa.json
          git commit -m 'v246: verified smooth client video, progressive payouts and hidden completion'
          git push origin HEAD:feature/client-smooth-v246
