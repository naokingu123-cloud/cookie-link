name: Arcade v251 Dango and ten-game cabinet
on:
  workflow_dispatch:
  push:
    branches: ['main', 'feature/arcade-v249', 'feature/v250-tabs-castella61', 'feature/v251-dango-de-bingo']
    paths:
      - 'index.html'
      - 'app-version.json'
      - 'assets/arcade-v249/**'
      - 'assets/arcade-brand-v249*'
      - 'assets/arcade-tabs-v249*'
      - 'assets/arcade-surfaces-v249*'
      - 'assets/game-menu-v91.js'
      - 'assets/lineups-v91.js'
      - 'assets/shared-machine-v176.js'
      - 'assets/party-castella*'
      - 'assets/castella-lesson.js'
      - 'assets/dango*'
      - 'assets/dango-art/**'
      - 'server-thinking-v251.mjs'
      - 'tests/*v251*'
      - 'optimized/app-01.js'
      - 'optimized/style-01.css'
      - 'tests/*v250*'
      - 'tests/arcade-visual-v249.mjs'
      - '.github/workflows/arcade-visual-v249.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and unchanged game, color and payout behavior
        run: |
          npm run check
          npm run test:sixdrop
          npm run test:castella
          npm run test:dango
          node tests/client-smooth-v246.mjs
          node tests/hidden-engine-clocks-v246.mjs
          node tests/hidden-results-v246.mjs
          node tests/monitor-game-colors-v248.mjs
          node tests/client-join-ack-v248.mjs
      - name: Install browser
        id: browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Ten tabs, shared BET and continuous reach strip
        id: tabs
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/tabs-v250-browser.mjs
      - name: Retain tab diagnostics immediately on failure
        if: ${{ !cancelled() && steps.tabs.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: arcade-v250-tabs-diagnostics
          path: qa-tabs-v250/
          retention-days: 3
      - name: Dango placement, thinking deadline, skewers and payout
        id: dango
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/dango-v251-view.mjs
      - name: Castella61 real eight-ball round, gauges and Sugar
        id: castella
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/castella-v250-view.mjs
      - name: Retain Castella diagnostics immediately on failure
        if: ${{ !cancelled() && steps.castella.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: arcade-v250-castella-diagnostics
          path: qa-castella-v250/
          retention-days: 3
      - name: Transparent Six Drop all-clear reach
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/sixdrop-reach-v250.mjs
      - name: Existing client and progressive HUD
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: |
          node tests/client-browser-v243.mjs
          node tests/sixdrop-hud-v247.mjs
      - name: Full hidden ten-game round, payout and carry
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/client-hidden-browser-v246.mjs
      - name: Retain every game screenshot and behavior report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-v251-visual-verification
          path: |
            qa-v250/
            qa-dango-v251/
            qa-tabs-v250/
            qa-castella-v250/
            qa-sixdrop-v250/
            qa-client-v243/
            docs/client-v246-qa.json
          retention-days: 7
