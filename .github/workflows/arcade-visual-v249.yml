name: Arcade v254 Sugar Challenge and Dango reach presentation
on:
  workflow_dispatch:
  push:
    branches: ['main', 'feature/arcade-v249', 'feature/v250-tabs-castella61', 'feature/v251-dango-de-bingo', 'feature/v252-dango-art-reach-pages', 'feature/v253-dango-tsukimi-lines', 'feature/v254-sugar-challenge']
    paths:
      - 'index.html'
      - 'app-version.json'
      - 'assets/arcade-v249/**'
      - 'assets/arcade-brand-v249*'
      - 'assets/arcade-tabs-v249*'
      - 'assets/arcade-surfaces-v249*'
      - 'assets/game-menu-v91.js'
      - 'assets/lineups-v91.js'
      - 'assets/shared-machine-v176.js'
      - 'assets/party-castella*'
      - 'assets/castella-lesson.js'
      - 'assets/dango*'
      - 'assets/dango-art/**'
      - 'assets/dango-art-v252/**'
      - 'assets/dango-art-v253/**'
      - 'assets/sweets-results-v253*'
      - 'assets/results-art-v253/**'
      - 'assets/sugar-challenge*v254*'
      - 'assets/sugar-roulette-v254.js'
      - 'assets/sugar-art-v254/**'
      - 'assets/reach-art-v254/**'
      - 'assets/shared-machine-core-v196.js'
      - 'assets/server-payout-control-v3.js'
      - 'assets/server-offline-settlement-worker-v3.js'
      - 'server-thinking-v251.mjs'
      - 'server-sugar*v254.mjs'
      - 'server-core-loader-v220.mjs'
      - 'server-payout-preload-v3.mjs'
      - 'tests/*v251*'
      - 'tests/*v252*'
      - 'tests/*v253*'
      - 'tests/*v254*'
      - 'scripts/*v254*'
      - 'docs/sugar-challenge-v254-probabilities.json'
      - 'docs/dango-v254-calibration.json'
      - 'package.json'
      - 'package-lock.json'
      - 'optimized/app-01.js'
      - 'optimized/style-01.css'
      - 'tests/*v250*'
      - 'tests/arcade-visual-v249.mjs'
      - '.github/workflows/arcade-visual-v249.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and unchanged game, color and payout behavior
        run: |
          npm run check
          npm run test:sixdrop
          npm run test:castella
          npm run test:dango
          npm run test:sugar
          node tests/client-smooth-v246.mjs
          node tests/hidden-engine-clocks-v246.mjs
          node tests/hidden-results-v246.mjs
          node tests/monitor-game-colors-v248.mjs
          node tests/client-join-ack-v248.mjs
      - name: Install browser
        id: browser
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Sugar Challenge scale, bottle, cards, folding and JPC presentation
        id: sugar
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/sugar-challenge-v254-browser.mjs
      - name: Retain Sugar Challenge screenshots and diagnostics immediately
        if: ${{ !cancelled() && (steps.sugar.outcome == 'success' || steps.sugar.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: arcade-v254-sugar-verification
          path: qa-sugar-v254/
          retention-days: 3
      - name: Sweets result scroll, rows and transition without payout changes
        id: results
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/results-v253-browser.mjs
      - name: Retain result screenshots immediately
        if: ${{ !cancelled() && (steps.results.outcome == 'success' || steps.results.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: arcade-v254-results-verification
          path: qa-results-v253/
          retention-days: 3
      - name: Ten tabs, shared BET and four-item reach pages
        id: tabs
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/tabs-v250-browser.mjs
      - name: Retain tab diagnostics immediately on failure
        if: ${{ !cancelled() && steps.tabs.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: arcade-v254-tabs-diagnostics
          path: qa-tabs-v250/
          retention-days: 3
      - name: Dango placement, thinking deadline, skewers and payout
        id: dango
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/dango-v251-view.mjs
      - name: Retain Dango diagnostics immediately on failure
        if: ${{ !cancelled() && steps.dango.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: arcade-v254-dango-diagnostics
          path: qa-dango-v251/
          retention-days: 3
      - name: Castella61 real eight-ball round, gauges and Sugar
        id: castella
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/castella-v250-view.mjs
      - name: Retain Castella diagnostics immediately on failure
        if: ${{ !cancelled() && steps.castella.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: arcade-v254-castella-diagnostics
          path: qa-castella-v250/
          retention-days: 3
      - name: Transparent Six Drop all-clear reach
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/sixdrop-reach-v250.mjs
      - name: Existing client and progressive HUD
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: |
          node tests/client-browser-v243.mjs
          node tests/sixdrop-hud-v247.mjs
      - name: Full hidden ten-game round, payout and carry
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node tests/client-hidden-browser-v246.mjs
      - name: Retain every game screenshot and behavior report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-v254-visual-verification
          path: |
            qa-v250/
            qa-dango-v251/
            qa-results-v253/
            qa-sugar-v254/
            qa-tabs-v250/
            qa-castella-v250/
            qa-sixdrop-v250/
            qa-client-v243/
            docs/client-v246-qa.json
          retention-days: 7
