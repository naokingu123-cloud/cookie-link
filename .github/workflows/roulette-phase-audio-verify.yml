name: Verify roulette timing LEDs and audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/roulette-phase-audio-verify.yml'
      - '.github/maintenance/roulette_phase_audio_20261025.py'
      - '.github/tests/roulette_phase_audio_20261025.py'
permissions:
  contents: write
concurrency:
  group: cookie-roulette-phase-audio
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact-source guarded update
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/maintenance/roulette_phase_audio_20261025.py');s=p.read_text()
          s=s.replace('p.write_text(s)',"rep('centerDisplay.visible=false;','centerDisplay.visible=true;')\np.write_text(s)")
          p.write_text(s)
          PY
          python .github/maintenance/roulette_phase_audio_20261025.py
      - name: Install browser test dependencies
        run: |
          pip install playwright > /tmp/browser-install.log 2>&1
          python -m playwright install --with-deps chromium >> /tmp/browser-install.log 2>&1
      - name: Check timing display and audio reset scenarios
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/tests/roulette_phase_audio_20261025.py');s=p.read_text()
          s=s.replace("page.wait_for_timeout(500);assert page.evaluate('__qa.driver.physics.angle')!=a;","page.wait_for_function('(angle)=>__qa.driver.physics.angle!==angle',arg=a,timeout=15000);")
          s=s.replace("page.wait_for_timeout(700);after=", "print('ROTATION_STATE',page.evaluate('__qa.visibility'),errors,flush=True);page.wait_for_function('(angle)=>__qa.driver.physics.angle!==angle',arg=before['angle'],timeout=15000);after=")
          s=s.replace("get driver(){return rouletteDriver}","get visibility(){return {inView,hidden:document.hidden,userPaused,menuOpen,phase:app.phase,paused:app.paused,ready:rouletteReady,loading:document.querySelector('.a8-loading')?.textContent}},get driver(){return rouletteDriver}")
          s=s.replace("page.evaluate(\"__qa.driver.draw.setState('complete')\");a=", "print('PRE_END_STATE',page.evaluate('__qa.visibility'),errors,flush=True);page.evaluate(\"__qa.driver.draw.setState('complete')\");a=")
          s=s.replace("lambda e:errors.append(str(e))", "lambda e:(errors.append(str(e)),print('PAGE_ERROR',str(e),flush=True))")
          p.write_text(s)
          PY
          python .github/tests/roulette_phase_audio_20261025.py
      - name: Retain test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-phase-audio-previews
          path: |
            bet_430.png
            final_430.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Record verified behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          raw=Path('index.html').read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          note='\n\n## 追加更新: BET20秒・回転・段階LED・音声復帰（2026-10-25）\n'
          note+='- BET20秒。群内の1/2/3球、4/5球は2秒間隔。群の全入賞完了から5秒で次群を発射。盤面処理を待たず、逆順入賞/故障球にも対応。\n'
          note+='- BET/抽選終了後も回転。非表示/メニューの休止は維持。中央LCDを可視化しBET TIME、1st BALLS、2nd BALLS、3rd BALL、4th BALL、FINAL BALL、DRAW ENDを表示。BET中は番号ポケットに文字、開始で番号に復帰。外周LEDも段階別。\n'
          note+='- 参加盤面の現在の全消しリーチ番号を滑らかな虹色に。0BET/入賞済み/古い予測を除外。既存の単独HIT予測を使用する試験表示で、複数球条件付き予測を新設していない。\n'
          note+='- 音声はラウンド/世代で準備・停止・フェードを管理。古い準備完了で次ゲームを停止しない。音量予約の解除と復元、音声グラフ/デコード済み音源の保持、中断からの復帰を実装。確認画面なし。\n'
          note+='- Chromium検証: 発射2秒/入賞後5秒・逆順/故障/リセット・JPC70球、待機/終了時の回転、各LED段階。実MP3/WAV波形、初回/通常次ゲーム/強制終了3回/6連続リセット/古いplay遅延/AudioContext中断/JPC往復後の再生を確認。\n'
          note+='- 盤面Engine、3/2同時消去、物理衝突実装と音源/埋込素材は不変を確認。iPhone実機聴感・TTS音声・自然物理の全8/70球通しプレイは未検証。時刻検証は実ドライバにテスト用着弾を入力した。\n'
          note+='- 最新index.html blob: `'+sha+'`。\n'
          p=Path('HANDOFF.md');p.write_text(p.read_text()+note)
          p=Path('docs/ROULETTE_NEXT_UPDATE_AND_CHOCO_CONCEPTS.md');p.write_text('> 更新: BET20秒・回転・発射・LED・音声は実装とChromium検証済み。詳細はHANDOFF.md末尾。以下は元の仕様記録。第2ゲームは素材案のまま未実装。\n\n'+p.read_text())
          print('VERIFIED_GAME_BLOB',sha)
          PY
      - name: Save verified game files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html HANDOFF.md docs/ROULETTE_NEXT_UPDATE_AND_CHOCO_CONCEPTS.md .github/tests/roulette_phase_audio_20261025.py .github/maintenance/roulette_phase_audio_20261025.py
          git commit -m 'Use timed draws stage LEDs continuous rotation and round-safe audio'
          git push origin HEAD:main
