name: Verify and integrate Six Candy tutorial and transitions
on:
  push:
    branches: [main]
    paths:
      - '.github/maintenance/six-stage-v5/**'
      - '.github/workflows/integrate-six-stage-v5.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verification tools
        run: |
          timeout 120 python3 -m pip install --disable-pip-version-check --timeout 20 pillow playwright
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME_PATH" ]; then
            echo "SIX_BROWSER_EXECUTABLE=$CHROME_PATH" >> "$GITHUB_ENV"
          else
            timeout 150 python3 -m playwright install chromium
          fi
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --max-time 75 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf' --output "$HOME/.local/share/fonts/NotoSansCJKjp-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
      - name: Apply guarded presentation changes
        run: python3 .github/maintenance/six-stage-v5/install.py
      - name: Verify retained rules and browser behavior
        run: |
          node --check assets/six-candy.js
          node .github/tests/six_rounds_v4.cjs
          python3 .github/tests/run_with_system_chrome.py .github/tests/six_stage_v5_browser.py
      - name: Retain candidate and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-stage-v5-candidate
          path: |
            qa-six-v5/
            index.html
            assets/six-candy*.js
            assets/six-candy*.css
            assets/six-candy-png/
            .github/tests/six_stage_v5_browser.py
          include-hidden-files: true
          retention-days: 3
      - name: Save only the verified game
        run: |
          cp qa-six-v5/verification.json docs/six-stage-v5-verification.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('HANDOFF.md')
          p.write_text(p.read_text()+'\n\n## 2026-10-26 — Stage v5: 待機説明・キャンディ枠・Round切替\n- BET待機中は本番盤面を作らず18秒の4場面で番号HIT/4連結と連鎖/形役とNEXT ROUND/シュガーと全消しを例示。小盤面も同じ説明。本番番号はSTART時だけ配置。説明はゲーム乱数/配当/番号を変更しない。\n- 元PNG由来キャンディを組み合わせたWebP枠。35単位のキャンディ直径を維持。前/現在/次Roundを盤面外の上部左へ集約し、上部右に全消しWIN。右の3列リールは32px行・実WIN値・キャンディ図だけ。全Round一覧/重複ロゴを除去。\n- 通常消去/役の演出を強化。静止中は中心/半径固定で微小回転と光沢。Round進展では残りの飴を弾き飛ばし、新盤面を上から1段ずつ、下段から積み上げる。これは描画のみで全消し配当を発生させない。切替中の番号は待機列で保持し、再配置完了後に処理。リセットで取消。\n- ルール/他2ゲーム/3D/音声ホストの不変比較、既存ルール・ブラウザ検証、説明の本番状態/RNG非干渉、全行入場終点、切替中の番号保持、リセット取消を検証。iPhone実機・聴感・自然物理8球通しは未検証。公開確認は別workflow。\n- 編集元 assets/six-candy-stage.js/.css、rounds-ui.js、rounds-engine.js。バンドルとindex.htmlへ組込。検証 docs/six-stage-v5-verification.json。\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/six-candy.js assets/six-candy-rounds-engine.js assets/six-candy-rounds-ui.js assets/six-candy-stage.js assets/six-candy-stage.css assets/six-candy-png/frame.webp .github/tests/six_stage_v5_browser.py docs/six-stage-v5-verification.json HANDOFF.md
          git commit -m 'Add verified 18-second BET tutorial, candy frame and staged Round transitions'
          git push origin HEAD:main
