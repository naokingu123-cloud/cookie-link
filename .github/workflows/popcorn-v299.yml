name: Popcorn cinema atelier v299
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/popcorn-*-v299.*'
      - 'assets/popcorn-art-v299/**'
      - 'assets/popcorn-engine.js'
      - 'assets/popcorn-host.js'
      - 'assets/popcorn-view.js'
      - 'assets/award-presentation-v277.js'
      - 'assets/demo-suite-v91.js'
      - 'index.html'
      - 'tests/popcorn-v299-*.mjs'
      - '.github/workflows/popcorn-v299.yml'
permissions:
  contents: read
jobs:
  native-popcorn-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [native, pops, grand]
    env:
      POPCORN299_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unchanged native Popcorn rules, exact credit deltas and reachable witnesses
        run: |
          node --check tests/popcorn-v299-browser.mjs
          node tests/popcorn-v299-rules.mjs
          node tests/popcorn-v299-awards.mjs
          node tests/award-presentation-v277.mjs
          node tests/popcorn-v299-browser.mjs --fixtures-only
      - name: Japanese fonts and Chromium
        run: |
          if [ -z "$(fc-list :lang=ja family)" ]; then
            timeout 150s sudo bash -e -c '
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y fonts-noto-cjk
            '
          fi
          test -n "$(fc-list :lang=ja family)"
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            timeout 150s npx playwright install --with-deps chromium
            browser_path="$(node -p "require('playwright').chromium.executablePath()")"
          fi
          test -x "$browser_path"
          timeout 20s "$browser_path" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Real POP, clear, boost and eighth-ball result with six-grade raster lineage
        run: node tests/popcorn-v299-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popcorn-v299-presentation-${{ matrix.group }}
          path: qa-popcorn-v299/
          if-no-files-found: error
          retention-days: 7
