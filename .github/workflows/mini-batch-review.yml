name: Mini board grouped clear review
on:
  push:
    paths:
      - '.github/workflows/mini-batch-review.yml'
      - '.github/maintenance/mini_batch_20261025.py'
      - '.github/tests/cookie-link-mini-batch.cjs'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect grouped clear and mini board code
        if: ${{ hashFiles('.github/maintenance/mini_batch_20261025.py') == '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('index.html').read_text().splitlines()
          terms=['class Engine','class Arcade','async process','async resolve','async clear','async drain','accept(','enqueue(','miniCanvas','drawMini','chain-pop','tab-chain','mini-chain','onNumber','NORMAL_DRAW_GROUPS','hitFlash','hit-flash','mini-link','function render','function build','function init']
          hits=[i for i,line in enumerate(lines) if any(t in line for t in terms) and len(line)<18000]
          seen=set()
          for i in hits:
              for j in range(max(0,i-4),min(len(lines),i+28)):
                  if j not in seen:
                      seen.add(j)
                      line=lines[j]
                      if len(line)>18000: line=line[:250]+' [long embedded asset omitted]'
                      print(f'{j+1}: {line}')
          PY
      - name: Apply guarded patch and validate syntax
        if: ${{ hashFiles('.github/maintenance/mini_batch_20261025.py') != '' }}
        run: python3 .github/maintenance/mini_batch_20261025.py
      - name: Browser regression test
        if: ${{ hashFiles('.github/tests/cookie-link-mini-batch.cjs') != '' }}
        run: |
          npm install --prefix /tmp/cookie-link-qa playwright
          /tmp/cookie-link-qa/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/cookie-link-qa/node_modules node .github/tests/cookie-link-mini-batch.cjs
      - name: Commit verified game update and remove temporary workflow
        if: ${{ hashFiles('.github/maintenance/mini_batch_20261025.py') != '' && hashFiles('.github/tests/cookie-link-mini-batch.cjs') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mini-batch-review.yml
          git add index.html HANDOFF.md
          git commit -m 'Fix grouped cell clears and show mini results after resolution'
          git push origin HEAD:main
