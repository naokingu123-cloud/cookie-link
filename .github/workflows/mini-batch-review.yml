name: Mini board grouped clear review
on:
  push:
    paths:
      - '.github/workflows/mini-batch-review.yml'
      - '.github/maintenance/mini_batch_20261025.py'
      - '.github/tests/cookie-link-mini-batch.cjs'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch and validate syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/maintenance/mini_batch_20261025.py');t=p.read_text()
          old="rep('  for(const value of release)this.engines.forEach((e,i)=>{if(this.enabled[i])e.enqueue(value);});','  if(release.length)this.engines.forEach((e,i)=>{if(this.enabled[i])e.enqueueBatch(release);});')"
          if old in t:t=t.replace(old,old[:-1]+',count=2)')
          a=t.index('for a,b in [(');b=t.index('for anchor in ',a)
          t=t[:a]+"assert '\\n'.join(before.splitlines()[3970:5190]) in s, '3D physics/render source changed'\nassert re.findall(r'data:[^\\s\\\"\\\x27<>]+;base64,[A-Za-z0-9+/=]+',before)==re.findall(r'data:[^\\s\\\"\\\x27<>]+;base64,[A-Za-z0-9+/=]+',s), 'Embedded asset changed'\n"+t[b:]
          t=t.replace('.tile.pending-hit .sweet{animation:pending-cell-pulse .8s ease-in-out infinite;','#screen .board .tile.pending-hit .sweet{animation:pending-cell-pulse .8s ease-in-out infinite!important;')
          t=t.replace('@media(prefers-reduced-motion:reduce){.tile.pending-hit .sweet,.mini-result-label','@media(prefers-reduced-motion:reduce){#screen .board .tile.pending-hit .sweet,.mini-result-label')
          p.write_text(t)
          test=Path('.github/tests/cookie-link-mini-batch.cjs')
          if test.exists():
              q=test.read_text().replace('});assert.deepEqual(preview.actual,preview.expected);','});console.log("PREVIEW_DIAGNOSTIC",JSON.stringify(preview));assert.deepEqual(preview.actual,preview.expected);')
              test.write_text(q)
          PY
          python3 .github/maintenance/mini_batch_20261025.py
      - name: Browser regression test
        if: ${{ hashFiles('.github/tests/cookie-link-mini-batch.cjs') != '' }}
        run: |
          npm install --prefix /tmp/cookie-link-qa playwright >/tmp/mini-install.log 2>&1 || { tail -60 /tmp/mini-install.log; exit 1; }
          /tmp/cookie-link-qa/node_modules/.bin/playwright install --with-deps chromium >>/tmp/mini-install.log 2>&1 || { tail -60 /tmp/mini-install.log; exit 1; }
          NODE_PATH=/tmp/cookie-link-qa/node_modules node .github/tests/cookie-link-mini-batch.cjs
      - name: Commit verified game update and remove temporary workflow
        if: ${{ hashFiles('.github/tests/cookie-link-mini-batch.cjs') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mini-batch-review.yml
          git add index.html HANDOFF.md .github/maintenance/mini_batch_20261025.py .github/tests/cookie-link-mini-batch.cjs
          git commit -m 'Fix grouped cell clears and show mini results after resolution'
          git push origin HEAD:main
