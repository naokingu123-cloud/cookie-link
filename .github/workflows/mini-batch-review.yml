name: Mini board grouped clear review
on:
  push:
    paths:
      - '.github/workflows/mini-batch-review.yml'
      - '.github/maintenance/mini_batch_20261025.py'
      - '.github/tests/cookie-link-mini-batch.cjs'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch and validate syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/maintenance/mini_batch_20261025.py');t=p.read_text()
          old="rep('  for(const value of release)this.engines.forEach((e,i)=>{if(this.enabled[i])e.enqueue(value);});','  if(release.length)this.engines.forEach((e,i)=>{if(this.enabled[i])e.enqueueBatch(release);});')"
          new=old[:-1]+',count=2)'
          if old in t:t=t.replace(old,new)
          a=t.index('for a,b in [(');b=t.index('for anchor in ',a)
          t=t[:a]+"assert '\\n'.join(before.splitlines()[3970:5190]) in s, '3D physics/render source changed'\nassert re.findall(r'data:[^\\s\\\"\\\x27<>]+;base64,[A-Za-z0-9+/=]+',before)==re.findall(r'data:[^\\s\\\"\\\x27<>]+;base64,[A-Za-z0-9+/=]+',s), 'Embedded asset changed'\n"+t[b:]
          p.write_text(t)
          PY
          python3 .github/maintenance/mini_batch_20261025.py
      - name: Browser regression test
        if: ${{ hashFiles('.github/tests/cookie-link-mini-batch.cjs') != '' }}
        run: |
          npm install --prefix /tmp/cookie-link-qa playwright
          /tmp/cookie-link-qa/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/cookie-link-qa/node_modules node .github/tests/cookie-link-mini-batch.cjs
      - name: Commit verified game update and remove temporary workflow
        if: ${{ hashFiles('.github/tests/cookie-link-mini-batch.cjs') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mini-batch-review.yml
          git add index.html HANDOFF.md .github/maintenance/mini_batch_20261025.py
          git commit -m 'Fix grouped cell clears and show mini results after resolution'
          git push origin HEAD:main
