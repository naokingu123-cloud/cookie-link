name: Verify CookieLink update
on:
  push:
    paths: ['.github/workflows/verify-cookielink-20261025.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax and asset references
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess,tempfile
          s=pathlib.Path('index.html').read_text()
          blocks=list(re.finditer(r'<script\b[^>]*>([\s\S]*?)</script>',s))
          for i,b in enumerate(blocks):
              if not b.group(1).strip():continue
              p=pathlib.Path('/tmp')/('cookie_check_'+str(i)+'.js')
              p.write_text(b.group(1))
              subprocess.run(['node','--check',str(p)],check=True)
          print('Checked',len(blocks),'inline scripts')
          assert "ctx.globalAlpha=Math.min(1,(1-t)*3.4)" in s
          assert "ctx.fillRect(123,124,37,36)" in s
          print('Static marker tests passed')
          PY

# Verify second stage including automatic starting and information strip.
