name: Winery crystal atelier v298
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/winery-*-v298.*'
      - 'assets/winery-art-v298/**'
      - 'assets/winery-pyramid-v1.js'
      - 'assets/winery-pyramid-core-v1.js'
      - 'assets/award-presentation-v277.js'
      - 'assets/demo-suite-v91.js'
      - 'index.html'
      - 'tests/winery-v298-browser.mjs'
      - 'tests/winery-v298-render.mjs'
      - 'tests/payout-fit-v302-layout.mjs'
      - '.github/workflows/winery-v298.yml'
permissions:
  contents: read
jobs:
  native-winery-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [stages, allfull]
    env:
      WINERY298_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unchanged native Winery rules and reachable visual witnesses
        run: |
          node --check tests/winery-v298-browser.mjs
          node tests/payout-fit-v302-layout.mjs
          node .github/tests/winery_payout_v72.cjs
          node tests/award-presentation-v277.mjs
          node tests/winery-v298-browser.mjs --fixtures-only
      - name: Japanese fonts and Chromium
        run: |
          if [ -z "$(fc-list :lang=ja family)" ]; then
            timeout 150s sudo bash -e -c '
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y fonts-noto-cjk
            '
          fi
          test -n "$(fc-list :lang=ja family)"
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            timeout 150s npx playwright install --with-deps chromium
            browser_path="$(node -p "require('playwright').chromium.executablePath()")"
          fi
          test -x "$browser_path"
          timeout 20s "$browser_path" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Real full/MIX/boost/all-full events, exact WIN and fixed geometry
        run: node tests/winery-v298-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winery-v298-presentation-${{ matrix.group }}
          path: qa-winery-v298/
          if-no-files-found: error
          retention-days: 7
