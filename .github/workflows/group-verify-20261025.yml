name: Validate grouped cookie game
on:
  push:
    paths: ['.github/workflows/group-verify-20261025.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax and grouped release contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('index.html').read_text()
          with tempfile.TemporaryDirectory() as d:
            for i,m in enumerate(re.finditer(r'<script\b[^>]*>([\s\S]*?)</script>',s)):
              if not m.group(1).strip():continue
              p=Path(d)/f's{i}.js';p.write_text(m.group(1));subprocess.run(['node','--check',str(p)],check=True)
          assert s.count('count===3?this.draws.slice(0,3):count===5?this.draws.slice(3,5)')==2
          assert 'distance=14.8' in s
          print('GROUP_BATCH_AND_SYNTAX_OK')
          PY
