name: Castella copper bakery v303
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/castella-*-v303.*'
      - 'assets/castella-art-v303/**'
      - 'assets/party-castella.js'
      - 'assets/party-castella-rules.js'
      - 'assets/party-castella-host.js'
      - 'assets/castella-lesson.js'
      - 'assets/award-presentation-v277.js'
      - 'index.html'
      - 'tests/castella-v303-*.mjs'
      - '.github/workflows/castella-v303.yml'
permissions:
  contents: read
jobs:
  native-castella-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Native rules and receipt contracts
        run: |
          node --check assets/castella-art-v303.js
          node --check assets/castella-award-v303.js
          node --check tests/castella-v303-browser.mjs
          node tests/castella-v303-browser.mjs --fixtures-only
          node tests/castella-v250-rules.mjs
          node tests/castella-v250-checkpoint.mjs
          node tests/award-presentation-v277.mjs
      - name: Japanese fonts and Chromium
        run: |
          if [ -z "$(fc-list :lang=ja family)" ]; then
            timeout 150s sudo bash -e -c '
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 update -qq
              apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1 install -y fonts-noto-cjk
            '
          fi
          test -n "$(fc-list :lang=ja family)"
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            timeout 150s npx playwright install --with-deps chromium
            browser_path="$(node -p "require('playwright').chromium.executablePath()")"
          fi
          test -x "$browser_path"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Live 61-hole inputs, 320 to 430px, mini, native final WIN and legacy
        run: node tests/castella-v303-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: castella-v303-presentation
          path: qa-castella-v303/
          if-no-files-found: error
          retention-days: 7
