name: Shared machine check

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'server.mjs'
      - 'optimized/app-01.js'
      - 'monitor.html'
      - 'assets/shared-machine-v176.js'
      - 'assets/precomputed-round-v174.js'
      - 'tests/shared-server-smoke.mjs'
      - 'scripts/start-shared-machine-tunnel.ps1'
      - 'scripts/setup-named-tunnel.ps1'
      - 'setup-named-tunnel.cmd'
      - 'start-shared-machine-tunnel.cmd'
      - 'docs/SHARED_MACHINE_TUNNEL.md'
      - '.github/workflows/shared-machine-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - name: JavaScript syntax check
        run: npm run check
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('scripts/start-shared-machine-tunnel.ps1','scripts/setup-named-tunnel.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ': ' + $_.Message) }
              exit 1
            }
          }
      - name: Windows PowerShell 5.1 encoding guard
        shell: bash
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' scripts/start-shared-machine-tunnel.ps1 scripts/setup-named-tunnel.ps1; then
            echo 'PowerShell scripts must remain ASCII-only for Windows PowerShell 5.1 compatibility.'
            exit 1
          fi
      - name: Multi-client server smoke test
        run: npm run test:shared
