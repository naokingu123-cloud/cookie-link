name: Shared machine check

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'server.mjs'
      - 'server-startup-sanitize-v217.mjs'
      - 'server-core-loader-v217.mjs'
      - 'server-core.mjs'
      - 'server-rtc-preload.mjs'
      - 'server-payout-preload-v3.mjs'
      - 'optimized/app-01.js'
      - 'monitor.html'
      - 'app-version.json'
      - 'assets/server-monitor-payout-v1.css'
      - 'assets/server-monitor-payout-v3.js'
      - 'assets/server-monitor-host-stability-v217.js'
      - 'assets/server-monitor-system-filter-v213.js'
      - 'assets/server-payout-control-v3.js'
      - 'assets/shared-core-patch-v216.js'
      - 'assets/shared-client-controller-v219.js'
      - 'assets/server-offline-settlement-worker-v3.js'
      - 'assets/shared-machine-v176.js'
      - 'assets/shared-machine-core-v196.js'
      - 'assets/shared-roulette-webrtc-host-v217.js'
      - 'assets/shared-roulette-client-v219.js'
      - 'assets/shared-host-keepalive-v206.js'
      - 'assets/shared-host-speed-v219.js'
      - 'tests/shared-rtc-signaling.mjs'
      - 'tests/client-no-local-eight.mjs'
      - 'tests/server-v217-stable-smoke.mjs'
      - 'tests/shared-v219-continuous-rounds.mjs'
      - 'tests/shared-v219-three-live-cycles.mjs'
      - 'tests/payout-v3-runtime.mjs'
      - 'scripts/start-shared-machine-tunnel.ps1'
      - 'scripts/start-shared-machine-v205.ps1'
      - 'scripts/launch-host-browser-v205.ps1'
      - 'scripts/setup-named-tunnel.ps1'
      - 'setup-named-tunnel.cmd'
      - 'start-shared-machine-tunnel.cmd'
      - 'docs/SHARED_MACHINE_TUNNEL.md'
      - '.github/workflows/shared-machine-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - name: JavaScript syntax check
        run: npm run check
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @(
            'scripts/start-shared-machine-tunnel.ps1',
            'scripts/start-shared-machine-v205.ps1',
            'scripts/launch-host-browser-v205.ps1',
            'scripts/setup-named-tunnel.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ': ' + $_.Message) }
              exit 1
            }
          }
      - name: Windows PowerShell 5.1 encoding guard
        shell: bash
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' \
            scripts/start-shared-machine-tunnel.ps1 \
            scripts/start-shared-machine-v205.ps1 \
            scripts/launch-host-browser-v205.ps1 \
            scripts/setup-named-tunnel.ps1; then
            echo 'PowerShell scripts must remain ASCII-only for Windows PowerShell 5.1 compatibility.'
            exit 1
          fi
      - name: Stable shared-machine regressions
        run: npm run test:shared
      - name: Physical roulette continuity guard
        shell: bash
        run: |
          grep -q "rouletteTimeScale" optimized/app-01.js
          grep -q "rouletteTimeScale=2" assets/shared-host-speed-v219.js
          grep -q "browser clocks unchanged" assets/shared-host-speed-v219.js
          grep -q "smoothRoulette" assets/server-monitor-host-stability-v217.js
          grep -q "Do not drop the relay merely because ICE connected" assets/shared-roulette-webrtc-host-v217.js
          grep -q "boundaries must not blank" assets/shared-roulette-client-v219.js
          grep -q "three-round fresh-board" tests/shared-v219-continuous-rounds.mjs
          grep -q "three live join/start/result" tests/shared-v219-three-live-cycles.mjs
          grep -q "SWEETS_AUTONOMOUS_ROUNDS='0'" server.mjs
          if grep -q "server-autonomous-rounds-v213.mjs" server.mjs; then
            echo 'Legacy synthetic autonomous rounds must not be loaded.'
            exit 1
          fi
