name: Forecast cache diagnosis v243
on:
  workflow_dispatch:
  push:
    branches: ['fix/client-perf-v243']
    paths: ['tests/client-forecast-inspect-v243.mjs', '.github/workflows/client-forecast-inspect-v243.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/client-forecast-inspect-v243.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-inspect-v243
          path: qa-client-v243
          retention-days: 3
