name: Dango and Sugar v268 release verification
on:
  workflow_dispatch:
  push:
    branches: [main, feature/v268-dango-sugar]
    paths:
      - 'assets/**'
      - 'index.html'
      - 'app-version.json'
      - 'download-sw-v255.js'
      - 'server*sugar*'
      - 'server-payout-preload-v3.mjs'
      - 'tests/**'
      - 'scripts/*v268*'
      - 'docs/*v268*'
      - 'package.json'
      - '.github/workflows/dango-sugar-v268.yml'
permissions:
  contents: read
jobs:
  dango:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and saved-revision rules
        run: |
          npm run check
          npm run test:dango
          node tests/download-v255-cache.mjs
          node tests/edition-choice-v255.mjs
      - name: Independently enumerate current payout and safe starting layouts
        run: |
          g++ -std=c++20 -O3 scripts/dango-v268-enumerate.cpp -o /tmp/dango-v268-enumerate
          /tmp/dango-v268-enumerate > /tmp/dango-v268-independent.json
          node tests/dango-v268-calibration.mjs /tmp/dango-v268-independent.json
      - name: Use Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Legible payouts, six highest roles, FREE, GET, next-ball reach and mobile layout
        run: node tests/dango-v268-view.mjs
      - name: Saved v266 display
        run: node tests/dango-v266-view.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dango-v268-visual-and-math
          path: |
            qa-dango-v268-view/
            qa-dango-v266-view/
            /tmp/dango-v268-independent.json
          retention-days: 7
  sugar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: New and saved Sugar rules, ledger and local BET lifecycle
        run: |
          npm run test:sugar
          node tests/sugar-challenge-v268-rules.mjs
          node scripts/sugar-challenge-v268-probabilities.mjs --check
          node tests/local-sugar-v267.mjs
          node tests/local-sugar-v268-native.mjs
          node tests/local-debug-v258.mjs
      - name: Use Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: BET-time JP and multiplier, gauges, early lucky JPC and responsive display
        run: node tests/sugar-challenge-v254-browser.mjs
      - name: Local native roulette, BET-time Sugar and actual eight-ball settlement
        if: ${{ !cancelled() }}
        run: node tests/local-debug-v258-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sugar-v268-visual-and-lifecycle
          path: |
            qa-sugar-v254/
            qa-local-debug-v258/
          retention-days: 7
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Use Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "SWEETS_DOWNLOAD_BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Server native ten-game recording and deterministic payout
        run: node tests/download-v255-compute.mjs
      - name: Offline resume, server restart and credit settlement
        run: node tests/download-v255-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-v268-regression
          path: qa-download-v255/
          retention-days: 7
