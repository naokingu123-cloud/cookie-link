name: Verify Six Candy Round v4 and public Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'assets/six-candy*'
      - 'assets/six-candy-png/**'
      - '.github/tests/six_rounds_v4*'
      - .github/workflows/verify-six-candy.yml
      - docs/six-v4-release.md
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify symmetric gaps, trajectories, palettes and payouts
        run: node .github/tests/six_rounds_v4.cjs
      - name: Install isolated browser verification
        run: |
          pip install playwright >/tmp/six-browser-install.log 2>&1
          python3 -m playwright install --with-deps chromium >>/tmp/six-browser-install.log 2>&1 || { tail -60 /tmp/six-browser-install.log; exit 1; }
      - name: Verify original PNG, mobile, desktop, bonuses, sugar and audio
        run: python3 .github/tests/six_rounds_v4_browser.py
      - name: Verify the existing public Pages deployment
        run: python3 .github/tests/six_rounds_v4_public.py
      - name: Retain browser evidence and deployment hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-candy-v4-verified-pages
          path: qa-six-v4/
          retention-days: 3
