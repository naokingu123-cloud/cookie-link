<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWEETS LINK Server Monitor</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf8ff;background:#07111d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#173d5d 0,#0a1d2d 38%,#050b12 100%);color:#eaf8ff}
header{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:#07111de8;border-bottom:1px solid #6fd7ff44;backdrop-filter:blur(12px)}
h1{margin:0;font-size:22px;letter-spacing:.06em}.sub{font-size:12px;color:#8dcbe4}
.status{display:flex;gap:10px;align-items:center;font-size:13px}.dot{width:10px;height:10px;border-radius:50%;background:#39d98a;box-shadow:0 0 12px #39d98a}.dot.off{background:#ff6f6f;box-shadow:0 0 12px #ff6f6f}
main{display:grid;gap:16px;padding:16px;max-width:1500px;margin:auto}
.card{background:linear-gradient(180deg,#10283bcc,#091722e8);border:1px solid #6fd7ff42;border-radius:18px;box-shadow:0 14px 35px #0008;overflow:hidden}
.card h2{margin:0;padding:12px 15px;border-bottom:1px solid #6fd7ff2e;font-size:15px;letter-spacing:.06em;display:flex;gap:12px;align-items:center;justify-content:space-between}
.host-state{font-size:11px;color:#8dcbe4;font-weight:700;letter-spacing:.02em}
.host-frame{display:block;width:min(100%,1000px);height:min(60vh,560px);min-height:400px;margin:0 auto;border:0;background:#02070b}
.players-wrap{overflow:auto}.players{width:100%;border-collapse:collapse;font-size:13px}
.players th,.players td{padding:11px 10px;border-bottom:1px solid #6fd7ff1d;text-align:right;white-space:nowrap}
.players th{background:#0b1d2b;color:#83c7e4;font-size:10px;letter-spacing:.04em}
.players th:first-child,.players td:first-child{text-align:left}.player-name{font-weight:800;color:#fff}
.online{display:inline-block;width:8px;height:8px;border-radius:50%;background:#38d787;margin-right:7px}.offline{background:#66737c}
.money{font-variant-numeric:tabular-nums;font-weight:800}.win{color:#ffd85c}.ok{color:#61e6a0}.pending{color:#ffb764}
.empty-note{padding:30px;text-align:center;color:#7995a5}
@media(max-width:700px){header{padding:10px 12px}h1{font-size:17px}.host-frame{min-height:340px;height:52vh}.players{font-size:11px}.players th,.players td{padding:9px 7px}}
</style>
</head>
<body>
<header>
 <div><h1>SWEETS LINK SERVER MONITOR</h1><div class="sub">Physical roulette host + connected player status</div></div>
 <div class="status"><span id="dot" class="dot off"></span><span id="conn">connecting...</span></div>
</header>
<main>
 <section class="card">
  <h2><span>CURRENT PHYSICAL ROULETTE</span><span id="host-state" class="host-state">HOST STARTING…</span></h2>
  <iframe id="host-frame" class="host-frame" title="SWEETS LINK physical roulette host"></iframe>
 </section>
 <section class="card">
  <h2><span>CONNECTED PLAYERS</span><span id="round-state" class="host-state">ROUND - · 0 / 8</span></h2>
  <div class="players-wrap">
   <table class="players">
    <thead><tr><th>PLAYER</th><th>BET</th><th>CREDIT</th><th>ROUND WIN</th><th>PROGRESS</th><th>STATUS</th></tr></thead>
    <tbody id="players"></tbody>
   </table>
   <div id="empty" class="empty-note">プレイヤー接続待ち</div>
  </div>
 </section>
</main>
<script>
(()=>{'use strict';
const q=new URLSearchParams(location.search),machine=q.get('machine')||'public-01',adminToken=q.get('adminToken')||'';
const $=id=>document.getElementById(id),frame=$('host-frame'),tbody=$('players'),empty=$('empty');
let hostLastReload=0,hostActionBusy=false,lastRoundId='',lastBallCount=-1;

function hostUrl(){
 const u=new URL('/index.html',location.origin);
 u.searchParams.set('serverHost','1');u.searchParams.set('machine',machine);
 if(adminToken)u.searchParams.set('adminToken',adminToken);
 u.searchParams.set('hostBoot',String(Date.now()));
 return u.href;
}
function injectHostView(){
 try{
  const d=frame.contentDocument;if(!d||!d.documentElement)return false;
  let style=d.getElementById('server-monitor-host-view');
  if(!style){style=d.createElement('style');style.id='server-monitor-host-view';style.textContent=
   'html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#02070b!important}'+
   '#viewport,#screen,.arena{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;margin:0!important;transform:none!important}'+
   '#screen>*:not(.arena){display:none!important}.arena>*:not(#cookie-roulette){display:none!important}'+
   '#cookie-roulette{display:block!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;margin:0!important;transform:none!important;background:#02070b!important}'+
   '#manual-number-toggle,#manual-number-panel,#bet-countdown,.roulette-info-strip{display:none!important}';
   d.head.append(style);
  }
  return true;
 }catch{return false;}
}
async function ensurePhysicalHost(){
 injectHostView();
 let w;try{w=frame.contentWindow;}catch{return;}
 const sm=w?.SweetsSharedMachine;
 if(!sm||!sm.client){
  $('host-state').textContent='HOST LOADING…';
  if(Date.now()-hostLastReload>12000){hostLastReload=Date.now();frame.src=hostUrl();}
  return;
 }
 if(hostActionBusy)return;
 hostActionBusy=true;
 try{
  if(!sm.online){
   $('host-state').textContent='HOST CONNECTING…';
   await sm.client.connect({timeout:12000});
  }
  if(sm.role!=='host'){
   $('host-state').textContent='HOST REGISTERING…';
   const registered=await sm.client.registerHost();
   sm.client.accept(registered);
  }
  const state=await sm.client.getState();
  sm.client.accept(state);
  const r=state.round,balls=r?.balls?.length||0;
  $('host-state').textContent='HOST ONLINE · '+(r?.phase||'WAITING')+' · '+balls+' / 8';
 }catch(error){
  $('host-state').textContent='HOST ERROR · '+(error?.message||'retrying');
 }finally{hostActionBusy=false;}
}

const fmt=n=>String(Math.max(0,Math.floor(Number(n)||0)));
function draw(data){
 $('dot').classList.remove('off');$('conn').textContent='ONLINE';
 const r=data.round,balls=r?.balls?.length||0;
 $('round-state').textContent='ROUND '+(r?.sequence||'-')+' · '+balls+' / 8';
 const hostOnline=!!data.machine?.hostConnected;
 $('host-state').textContent=hostOnline?'HOST ONLINE · '+(r?.phase||'WAITING')+' · '+balls+' / 8':'HOST STARTING…';

 const ps=r?.players||[];
 tbody.replaceChildren();empty.style.display=ps.length?'none':'block';
 for(const p of ps){
  const tr=document.createElement('tr'),status=p.settled?'SETTLED':(p.connected?(p.phase||'PLAYING'):'OFFLINE');
  tr.innerHTML='<td><span class="online '+(p.connected?'':'offline')+'"></span><span class="player-name"></span></td>'+
   '<td class="money">'+fmt(p.totalBet)+'</td><td class="money">'+fmt(p.currentCredit)+'</td>'+
   '<td class="money win">'+fmt(p.roundWin)+'</td><td>'+fmt(p.checkpointBall)+' / 8</td>'+
   '<td class="'+(p.settled?'ok':'pending')+'">'+status+'</td>';
  tr.querySelector('.player-name').textContent=p.displayName||String(p.playerId||'').slice(0,8);tbody.append(tr);
 }
 if(r?.id!==lastRoundId||balls!==lastBallCount){lastRoundId=r?.id||'';lastBallCount=balls;ensurePhysicalHost();}
}
async function poll(){
 try{
  const u='/api/admin/machines/'+encodeURIComponent(machine)+'?adminToken='+encodeURIComponent(adminToken)+'&_='+Date.now();
  const res=await fetch(u,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);draw(await res.json());
 }catch(error){$('dot').classList.add('off');$('conn').textContent='OFFLINE / '+error.message;}
}
frame.addEventListener('load',()=>{hostLastReload=Date.now();injectHostView();setTimeout(ensurePhysicalHost,400);});
frame.src=hostUrl();
poll();setInterval(poll,700);setInterval(ensurePhysicalHost,1500);
})();
</script>
</body>
</html>
