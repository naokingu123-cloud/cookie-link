<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWEETS LINK サーバー管理</title>
<link rel="stylesheet" href="/assets/server-monitor-payout-v1.css?v=217">
<link rel="stylesheet" href="/assets/stations-v235.css?v=235">
</head>
<body>
<!-- One physical-host iframe stays alive across all rounds. -->
<header>
 <div><h1>SWEETS LINK サーバー管理</h1><div class="sub">6ステーション・共通PO制御・プレイヤー成績・安定接続制御</div></div>
 <div class="status"><span id="dot" class="dot off"></span><span id="conn">接続中…</span></div>
</header>
<main>
 <section class="card host-card">
  <h2><span>現在の物理抽選機（標準1倍速）</span><span id="host-state" class="host-state">抽選機を起動中…</span></h2>
  <iframe id="host-frame" class="host-frame" title="SWEETS LINK 物理抽選機"></iframe>
 </section>
 <section class="card payout-card" id="payout-card">
  <h2><span>ペイアウト管理</span><span class="host-state">プレイヤー単位・全ゲーム共通設定</span></h2>
  <div class="summary">
   <div class="metric target"><small>標準目標PO</small><strong id="metric-target">-</strong></div>
   <div class="metric actual"><small>全体実測PO（表示用）</small><strong id="metric-actual">-</strong></div>
   <div class="metric bet"><small>確定累計BET</small><strong id="metric-bet">-</strong></div>
   <div class="metric win"><small>確定累計WIN</small><strong id="metric-win">-</strong></div>
  </div>
  <div class="controls" id="global-controls" data-control>
   <label class="field"><span>標準目標PO (%)</span><input id="target-rate" type="number" min="50" max="150" step="0.1"></label>
   <label class="field"><span>設定下限 (%)</span><input id="min-rate" type="number" min="40" max="150" step="0.1"></label>
   <label class="field"><span>設定上限 (%)</span><input id="max-rate" type="number" min="50" max="180" step="0.1"></label>
   <label class="field"><span>通常ラウンド最大変化</span><input id="max-step" type="number" min="0.1" max="20" step="0.1"></label>
   <label class="field"><span>差額回収ラウンド数</span><input id="recovery-rounds" type="number" min="1" max="50" step="1"></label>
   <label class="field"><span>目標からの最大補正</span><input id="max-bias" type="number" min="1" max="60" step="0.1"></label>
   <label class="field"><span>BET急変判定倍率</span><input id="bet-shock" type="number" min="1.1" max="10" step="0.1"></label>
   <button id="save-global" class="primary" type="button">標準設定を保存</button>
  </div>
  <div id="control-message" class="message">設定を読み込み中…</div>
  <div id="global-games" class="global-games"></div>
 </section>
 <section class="card players-card">
  <h2><span>プレイヤー一覧</span><span id="round-state" class="host-state">ラウンド -　待機中</span></h2>
  <div class="players-wrap">
   <table class="players">
    <thead><tr><th>プレイヤー</th><th>今回BET</th><th>CREDIT</th><th>今回WIN</th><th>累計BET</th><th>累計WIN</th><th>実測PO</th><th>設定PO</th><th>制御</th><th>球数</th><th>状態</th><th>詳細</th></tr></thead>
    <tbody id="players"></tbody>
   </table>
   <div id="empty" class="empty-note">プレイヤーの接続待ち</div>
  </div>
 </section>
</main>
<iframe id="settlement-worker" class="settlement-worker" title="切断時自動精算"></iframe>
<script src="/assets/server-monitor-host-stability-v217.js?v=217"></script>
<script src="/assets/server-monitor-payout-v3.js?v=217"></script>
<script src="/assets/server-monitor-system-filter-v213.js?v=217"></script>
<script src="/assets/stations-v235.js?v=235"></script>
</body>
</html>
